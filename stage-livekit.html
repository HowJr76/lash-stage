<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse Line — LiveKit Stage</title>
<meta name="theme-color" content="#42388C">
<link rel="icon" type="image/png" href="signal-micro.png">
<link rel="apple-touch-icon" href="signal-micro.png">
<!-- stage-livekit.html: the v7 Three.js world from stage.html, published
     into a LiveKit room as a video track. Transport is the only new part:
     the world module below is copied verbatim from stage.html except the
     render size / camera aspect (medallion 440x440 -> 1280x720 tile).
     State arrives as LiveKit data packets on topic "lash/stage":
       {"state": "idle"|"listening"|"thinking"|"speaking"}
     URL params: ?liveKitUrl=wss://...&token=<jwt>  (meet.livekit.io
     prefilled-link pattern). Optional: &state=<initial state>. -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/dist/livekit-client.umd.min.js"></script>
<script type="importmap">
{"imports": {
  "three": "./three.module.js",
  "three/addons/": "./addons/"
}}
</script>
<style>
  html, body { margin:0; height:100%; background:#101418; color:#e8eef2;
    font-family: ui-monospace, Menlo, Consolas, monospace; overflow:hidden; }
  #face { position:fixed; inset:0; background:#101418; }
  #world3d { width:100%; height:100%; display:none; }
  #world3d canvas { width:100% !important; height:100% !important; display:block; }
  #fallback { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:120px; }
  #lkstatus { position:fixed; top:10px; left:10px; z-index:10;
    background:rgba(10,14,18,.72); border:1px solid rgba(160,190,215,.25);
    border-radius:8px; padding:8px 12px; font-size:13px; line-height:1.5;
    color:#cfe0ee; white-space:pre-wrap; max-width:92vw; }
  #lkstatus .bad { color:#ff9a8a; }
  #lkstatus .ok { color:#9fe8b0; }
</style>
</head>
<body>
<div id="face"><div id="world3d"></div><div id="fallback">🐶</div></div>
<div id="lkstatus">boot…</div>
<script>
// ---- shim: the globals the v7 world module expects from stage.html ----
// In stage.html these live in the Meet-transport script (face medallion,
// v6 puppet, speech envelope). Here they are the minimal LiveKit forms:
// the module only reads PUP.speech (jaw envelope), WORLD.on, face /
// faceShow / FACE_VIDS (holder management), and currentAudio (unused —
// synthetic envelopes run in 'text' mode).
const qs = new URLSearchParams(location.search);
const face = document.getElementById('face');
const statusEl = document.getElementById('lkstatus');
const FACE_VIDS = {};
let faceState = 'idle';
function faceShow(name) { faceState = name || 'idle'; }
const WORLD = { on: false };
let currentAudio = null;
const PUP = { on: false, speech: null };

// Speech envelope synthesis — copied verbatim from stage.html (v6).
function synthEnvelope(text, seconds) {
  const words = (text || '').split(/\s+/).filter(Boolean);
  const syl = [];
  for (const w of words) {
    const groups = (w.toLowerCase().match(/[aeiouy]+/g) || []).length;
    syl.push(Math.max(1, Math.min(4, groups || 1)));
  }
  const total = syl.reduce((a, b) => a + b, 0) || 1;
  const win = 0.06, n = Math.max(1, Math.ceil(seconds / win));
  const env = new Array(n).fill(0);
  let t = 0.02, seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (const s of syl) {
    const dt = seconds * (s / total);
    const peak = 0.45 + rnd() * 0.5;
    for (let k = 0; k < 3; k++) {
      const idx = Math.floor((t + k * win) / win);
      if (idx < n) env[idx] = Math.max(env[idx], peak * (1 - k * 0.3));
    }
    t += dt;
  }
  return env;
}

// ---- stage state machine (driven by lash/stage data packets) ----
// Mapping onto the world's existing states: speaking -> idle clip + jaw
// envelope (ears perk via PUP.speech, exactly like a spoken line on the
// Meet stage); thinking -> 'work' (head-low, the pensive pose); idle and
// listening -> 'idle' (listening differs on the status line only today).
let stageState = 'idle';
let speechTimer = null;
const SPEECH_PHRASES = [
  'well hello there how are you doing today',
  'yes that is right let me tell you about it',
  'and another thing worth mentioning here',
  'so what do you think about all of that',
];
let speechPhrase = 0;
function startSpeech() {
  stopSpeech();
  const speak = () => {
    PUP.speech = { env: synthEnvelope(SPEECH_PHRASES[speechPhrase++ % SPEECH_PHRASES.length], 2.2),
                   mode: 'text', t0: performance.now() };
  };
  speak();
  speechTimer = setInterval(speak, 2100);
}
function stopSpeech() {
  if (speechTimer) { clearInterval(speechTimer); speechTimer = null; }
  PUP.speech = null;
}
function setStageState(name) {
  if (['idle', 'listening', 'thinking', 'speaking'].indexOf(name) < 0) name = 'idle';
  stageState = name;
  try {
    if (name === 'speaking') { window.worldSetState('idle'); startSpeech(); }
    else if (name === 'thinking') { stopSpeech(); window.worldSetState('work'); }
    else { stopSpeech(); window.worldSetState('idle'); }
  } catch (e) { /* world not ready yet; state is kept and re-applied */ }
  refreshStatus();
}
window.__lashSetStageState = setStageState;

// ---- status line (the Meet-era telemetry checklist, LiveKit edition) ----
const LK = { connected: false, publishing: false, err: null, identity: null };
function refreshStatus() {
  const d = window.__lashWorldDiag;
  let w;
  if (!d) w = 'world: boot';
  else {
    const yn = (b) => b ? '<span class="ok">ok</span>' : '<span class="bad">…</span>';
    w = 'webgl ' + yn(d.webgl) + (d.glKind ? ' (' + d.glKind + ')' : '') +
        ' · three ' + yn(d.threeImport === 'ok') +
        ' · model ' + yn(d.modelFetch === 'ok') +
        ' · bones ' + (d.bones ? d.bones.length : 0) +
        ' · frames ' + (d.frames || 0) +
        ' · stage ' + d.stage +
        (d.err ? ' · err: ' + d.err : '');
  }
  const lk = 'lk: ' + (LK.err ? '<span class="bad">' + LK.err + '</span>'
                        : LK.connected ? '<span class="ok">connected</span>' +
                            (LK.identity ? ' as ' + LK.identity : '')
                          : 'connecting…') +
             ' · publishing ' + (LK.publishing ? '<span class="ok">yes</span>' : 'no') +
             ' · state: ' + stageState;
  statusEl.innerHTML = w + '\n' + lk;
}
window.__lashRefreshStatus = refreshStatus;
window.__lashHello = () => { try { refreshStatus(); } catch (e) {} };
setInterval(refreshStatus, 1000);
refreshStatus();
const initialState = qs.get('state');
if (initialState) setStageState(initialState);
</script>
<script type="module">
// ---- 3D world (stage v7) ----
// Howard's VRML insight in modern form: the meeting sees this page, so
// the 3D world lives IN the page — a Three.js room with a rigged dog,
// rendered by the bot's browser. The wire still carries only the control
// signals the system already produces: faceShow states, and the per-line
// speech envelope the bridge ships (read from PUP.speech, exactly like
// the v6 puppet). Model: "Shiba Inu" by Quaternius (CC0 1.0, via Poly
// Pizza) — a stand-in body; Lash's own rig is a later asset.
//
// The asset has NO jaw bone and a single mesh, so per the spike rule the
// jaw is amplitude-driven head/muzzle motion: envelope -> head dip +
// neck dip + a small head drop, which reads as jaw movement at tile
// size. Ears (Ear1.L/R), head tilt, tail wag and the baked clips
// (Idle / Idle_2 / Idle_2_HeadLow / Jump_ToIdle) carry the rest.
//
// FALLBACK IS SACRED: no WebGL, CDN failure, model failure, or repeated
// runtime errors all leave WORLD.on false (or flip it back off) and the
// v6 puppet / v5 medallion run the call untouched. This layer can never
// produce a black or broken tile.
const WDIAG = { webgl: false, stage: 'boot', err: null, gl: null, glKind: null,
                bones: [], clips: [], frames: 0,
                threeImport: 'pending', modelFetch: 'pending', errors: [] };
window.__lashWorldDiag = WDIAG;
// v7.1 telemetry: capture the first errors of the page's life (the world
// init window) and re-publish hello at every world resolution so the
// bridge log shows what actually happened in the real browser.
const worldNotify = () => { try { if (window.__lashHello) window.__lashHello(); } catch (e) {} };
try {
  const cap = (msg) => { try {
    if (WDIAG.errors.length < 6) WDIAG.errors.push(String(msg).slice(0, 240));
  } catch (e) {} };
  window.addEventListener('error', (ev) => {
    if (performance.now() < 40000) cap('onerror: ' + (ev.message || ev.type || 'unknown'));
  });
  window.addEventListener('unhandledrejection', (ev) => {
    cap('reject: ' + ((ev.reason && ev.reason.message) || ev.reason || 'unknown'));
  });
} catch (e) { /* capture is best-effort */ }
const DOG_URL = window.__LASH_DOG_URL || 'dog.glb';
const WTUNE = { pitchSign: -1, tiltSign: 1, jawDip: 0.17, jawDrop: 0.012,
                neckDip: 0.09, tiltRad: 0.17, lookDown: 0.22,
                earSplay: 0.22, earBack: 0.12 };
window.__lashWorldTune = WTUNE;
window.worldSetState = () => {};   // real one replaces this during init
const wTimeout = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error('load timeout')), ms));
function worldFail(stage, err) {
  WDIAG.stage = stage;
  WDIAG.err = String((err && err.message) || err || stage);
  if (stage === 'imports' && WDIAG.threeImport === 'pending') WDIAG.threeImport = 'fail';
  if (WDIAG.modelFetch === 'pending' && (stage === 'build' || stage === 'model'))
    WDIAG.modelFetch = 'fail';
  worldNotify();
}

(async () => {
  let THREE, GLTFLoader;
  try {
    const probe = document.createElement('canvas');
    // v7.2: ask permissively — a bot browser on software GL can refuse a
    // default-attributes context it would grant with these flags.
    const probeAttrs = { failIfMajorPerformanceCaveat: false,
                         powerPreference: 'low-power', antialias: false };
    let gl = null, glKind = null;
    try { gl = probe.getContext('webgl2', probeAttrs); if (gl) glKind = 'webgl2'; } catch (e) {}
    if (!gl) { try { gl = probe.getContext('webgl', probeAttrs); if (gl) glKind = 'webgl'; } catch (e) {} }
    if (!gl) { try { gl = probe.getContext('experimental-webgl', probeAttrs); if (gl) glKind = 'experimental'; } catch (e) {} }
    if (!gl) { worldFail('webgl', 'no WebGL context in this browser'); return; }
    WDIAG.webgl = true;
    WDIAG.glKind = glKind;
    try {
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      WDIAG.gl = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL))
                     : String(gl.getParameter(gl.RENDERER));
    } catch (e) { WDIAG.gl = 'unknown'; }
    WDIAG.stage = 'imports';
    THREE = await import('three');
    ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
    WDIAG.threeImport = 'ok';
    worldNotify();
  } catch (e) { worldFail('imports', e); return; }

  const B = {};            // bones by name
  const ACT = {};          // animation actions by role
  const W = { jaw: 0, perk: 0, perkVel: 0, tilt: 0, tiltVel: 0,
              look: 0, lookVel: 0, prevSpeech: null, wagPhase: 0,
              flickAt: 2600 + Math.random() * 2600, flickT0: -1, flickEar: 'L',
              jumpUntil: 0, idle2Until: 0, nextIdle2: 9000 + Math.random() * 5000,
              errStreak: 0, applied: [] };
  let renderer = null, scene = null, camera = null, mixer = null, curAction = null;
  let cur = 'idle';

  function worldDisable() {
    if (!WORLD.on) return;
    WORLD.on = false;
    WDIAG.stage = 'disabled-runtime';
    worldNotify();
    const holder = document.getElementById('world3d');
    if (holder) holder.style.display = 'none';
    if (renderer) { try { renderer.setAnimationLoop(null); } catch (e) {} }
    const pc = document.getElementById('puppetCanvas');
    if (PUP.on && pc) pc.style.display = 'block';
    else if (!PUP.on) { try { faceShow(faceState); } catch (e) {} }
  }
  function worldEnable() {
    let holder = document.getElementById('world3d');
    if (!holder) {
      // The emoji fallback may have wiped #face before we were ready;
      // rebuild the holder rather than giving up (same trick as v6).
      face.textContent = '';
      holder = document.createElement('div');
      holder.id = 'world3d';
      holder.style.cssText = 'width:100%;height:100%';
      face.appendChild(holder);
    }
    if (renderer && renderer.domElement.parentNode !== holder)
      holder.appendChild(renderer.domElement);
    const pc = document.getElementById('puppetCanvas');
    if (pc) pc.style.display = 'none';
    for (const id of Object.values(FACE_VIDS)) {
      const el = document.getElementById(id);
      if (el) { el.style.display = 'none'; try { el.pause(); } catch (e) {} }
    }
    holder.style.display = 'block';
    WORLD.on = true;
    WDIAG.stage = 'live';
    worldNotify();
    // One delayed snapshot so the log also shows the rAF frame count —
    // proof the world is actually animating, not just initialized.
    setTimeout(() => worldNotify(), 15000);
    if (window.worldSetState) window.worldSetState(faceState);
  }

  try {
    WDIAG.stage = 'scene';
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
    // updateStyle=false: the stage CSS (#face canvas) sizes the canvas to
    // the medallion; an inline 440px style would overflow the circle and
    // show only one quadrant of the scene.
    renderer.setSize(1280, 720, false);   // stage-livekit: 720p tile (was 440x440 medallion)
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2019);
    scene.fog = new THREE.Fog(0x2b2019, 7, 16);
    camera = new THREE.PerspectiveCamera(34, 1280 / 720, 0.1, 60)   // stage-livekit: 16:9 (was 1);
    scene.add(new THREE.HemisphereLight(0xffe2b8, 0x3d2c1e, 1.15));
    const key = new THREE.DirectionalLight(0xffdfae, 2.4);
    key.position.set(2.2, 3.6, 2.4);
    key.castShadow = true;
    key.shadow.mapSize.set(512, 512);
    key.shadow.camera.left = -2; key.shadow.camera.right = 2;
    key.shadow.camera.top = 3; key.shadow.camera.bottom = -1;
    key.shadow.bias = -0.0004;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x9db8ff, 0.55);
    rim.position.set(-2.5, 1.8, -2.0);
    scene.add(rim);
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(9, 40),
      new THREE.MeshStandardMaterial({ color: 0x74522f, roughness: 0.95 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const rug = new THREE.Mesh(
      new THREE.CircleGeometry(1.02, 40),
      new THREE.MeshStandardMaterial({ color: 0x8a4433, roughness: 1 }));
    rug.rotation.x = -Math.PI / 2;
    rug.position.y = 0.002;
    rug.receiveShadow = true;
    scene.add(rug);

    WDIAG.stage = 'model';
    const loader = new GLTFLoader();
    const gltf = await Promise.race([loader.loadAsync(DOG_URL), wTimeout(25000)]);
    WDIAG.modelFetch = 'ok';
    worldNotify();
    const model = gltf.scene;
    scene.add(model);
    scene.updateMatrixWorld(true);
    // Normalize from the SKELETON, not the mesh bounds: Box3.setFromObject
    // ignores skinning and reads raw geometry (this export's armature
    // carries a x100 scale, so mesh bounds are meaningless). Bone world
    // positions are the truth: height -> 1.0, feet on floor, centered.
    const bonePts = [];
    model.traverse((o) => {
      if (o.isBone && !/^(PoleTarget|IK)/.test(o.name)) {
        const v = new THREE.Vector3();
        o.getWorldPosition(v);
        bonePts.push(v);
      }
    });
    let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity,
        minZ = Infinity, maxZ = -Infinity;
    for (const p of bonePts) {
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
    }
    const rawH = maxY - minY;
    const s = rawH > 0 ? 1.0 / rawH : 1;
    model.scale.setScalar(s);
    model.position.set(-((minX + maxX) / 2) * s, -minY * s, -((minZ + maxZ) / 2) * s);
    scene.updateMatrixWorld(true);
    model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });

    // GLTFLoader strips dots from node names ('Ear1.L' loads as 'Ear1L').
    const bone = (name) => model.getObjectByName(name) ||
                            model.getObjectByName(name.replace(/\./g, '')) || null;
    for (const n of ['Head', 'Neck3', 'Neck1', 'Ear1.L', 'Ear1.R', 'Tail1', 'Tail2', 'Torso'])
      B[n] = bone(n);
    WDIAG.bones = Object.keys(B).filter((k) => B[k]);
    if (!B.Head) { worldFail('rig', 'no Head bone in model'); return; }

    mixer = new THREE.AnimationMixer(model);
    const findClip = (name) => THREE.AnimationClip.findByName(gltf.animations, name);
    const mk = (name, loop) => {
      const c = findClip(name);
      if (!c) return null;
      const a = mixer.clipAction(c);
      a.loop = loop ? THREE.LoopRepeat : THREE.LoopOnce;
      a.clampWhenFinished = !loop;
      return a;
    };
    ACT.idle = mk('Idle', true);
    ACT.idle2 = mk('Idle_2', true);
    ACT.headlow = mk('Idle_2_HeadLow', true);
    ACT.jump = mk('Jump_ToIdle', false);
    WDIAG.clips = gltf.animations.map((a) => a.name);
    if (!ACT.idle) { worldFail('rig', 'no Idle clip in model'); return; }
    ACT.idle.play();
    curAction = ACT.idle;
    function crossTo(a, dur) {
      if (!a || a === curAction) return;
      const prev = curAction;
      a.enabled = true;
      a.reset();
      a.setEffectiveWeight(1);
      a.fadeIn(dur || 0.45);
      a.play();
      if (prev) prev.fadeOut(dur || 0.45);
      curAction = a;
    }

    // Camera: frame the dog from the head side, gentle three-quarter.
    const hv = new THREE.Vector3(), tv = new THREE.Vector3();
    B.Head.getWorldPosition(hv);
    if (B.Tail1) B.Tail1.getWorldPosition(tv); else tv.set(hv.x, hv.y, hv.z - 0.5);
    const fwd = hv.clone().sub(tv); fwd.y = 0;
    if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, 1);
    fwd.normalize();
    const side = new THREE.Vector3(-fwd.z, 0, fwd.x);
    camera.position.copy(hv)
      .addScaledVector(fwd, 1.5).addScaledVector(side, 0.52);
    camera.position.y = hv.y + 0.14;
    camera.lookAt(hv.x - fwd.x * 0.34, hv.y - 0.30, hv.z - fwd.z * 0.34);
    // Warm back wall behind the dog, facing the camera.
    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 9),
      new THREE.MeshStandardMaterial({ color: 0x4a3423, roughness: 1 }));
    wall.position.copy(fwd.clone().multiplyScalar(-3.6));
    wall.position.y = 2.2;
    wall.lookAt(0, 1.4, 0);
    scene.add(wall);

    window.worldSetState = (name) => {
      try {
        cur = name;
        W.idle2Until = 0;
        if (name === 'make') {
          if (ACT.jump) {
            crossTo(ACT.jump, 0.12);
            W.jumpUntil = performance.now() + ACT.jump.getClip().duration * 1000;
          }
          W.perkVel += 2.6;
        } else if (name === 'work') {
          crossTo(ACT.headlow || ACT.idle2 || ACT.idle, 0.5);
        } else {
          crossTo(ACT.idle, 0.4);
        }
      } catch (e) { /* state flips must never throw into the stage */ }
    };
    window.__lashWorld = {
      on: () => WORLD.on, jaw: () => W.jaw, state: () => cur, diag: WDIAG,
      tune: WTUNE,
      headRot: () => B.Head ? [B.Head.rotation.x, B.Head.rotation.y, B.Head.rotation.z] : null,
      cam: () => camera.position.toArray(),
    };

    const clock = new THREE.Clock();
    const spring = (x, v, target, stiff, damp, dt) => {
      v += ((target - x) * stiff - v * damp) * dt;
      x += v * dt;
      return [x, v];
    };
    function tick() {
      if (!WORLD.on) return;
      if (document.hidden) return;
      try {
        WDIAG.frames += 1;
        const dt = Math.min(0.05, clock.getDelta());
        const ts = performance.now(), t = ts / 1000;
        // Speech envelope -> jaw: identical math to the v6 puppet jaw.
        let amp = 0;
        if (PUP.speech) {
          const sp = PUP.speech;
          const ct = (sp.mode === 'audio' && currentAudio)
            ? currentAudio.currentTime : (ts - sp.t0) / 1000;
          const idx = Math.floor(ct / 0.06);
          if (idx >= 0 && idx < sp.env.length) amp = sp.env[idx];
        }
        W.jaw += (amp - W.jaw) * (amp > W.jaw ? 0.55 : 0.30);
        if (W.jaw < 0.003 && !PUP.speech) W.jaw = 0;
        if (PUP.speech && !W.prevSpeech) W.perkVel += 2.2;   // line start: ears up
        W.prevSpeech = PUP.speech;
        const perkT = PUP.speech ? 0.8 : (cur === 'make' ? 1.0 : (cur === 'work' ? 0.35 : 0.12));
        [W.perk, W.perkVel] = spring(W.perk, W.perkVel, perkT, 110, 13, dt);
        [W.tilt, W.tiltVel] = spring(W.tilt, W.tiltVel, cur === 'work' ? WTUNE.tiltRad : 0, 46, 10, dt);
        [W.look, W.lookVel] = spring(W.look, W.lookVel, cur === 'work' ? WTUNE.lookDown : 0, 46, 10, dt);
        if (ACT.jump && curAction === ACT.jump && ts > W.jumpUntil && W.jumpUntil)
          crossTo(ACT.idle, 0.35);
        // Idle variety: an occasional Idle_2 visit while just listening.
        if (cur === 'idle' && !PUP.speech && ACT.idle2) {
          if (!W.idle2Until && ts > W.nextIdle2) { crossTo(ACT.idle2, 0.6); W.idle2Until = ts + 3600; }
          else if (W.idle2Until && ts > W.idle2Until) {
            W.idle2Until = 0; W.nextIdle2 = ts + 9000 + Math.random() * 6000;
            crossTo(ACT.idle, 0.6);
          }
        }
        // Procedural layer: deltas added on top of the clip pose. Every
        // delta is UNDONE before the next mixer.update — a channel the
        // clip doesn't animate would otherwise accumulate our deltas
        // frame over frame (that bug stretched the neck in testing).
        for (const [obj, key2, val] of W.applied) obj[key2] -= val;
        W.applied.length = 0;
        mixer.update(dt);
        const add = (obj, key2, val) => { obj[key2] += val; W.applied.push([obj, key2, val]); };
        const jaw = W.jaw;
        if (B.Head) {
          add(B.Head.rotation, 'x', WTUNE.pitchSign * (jaw * WTUNE.jawDip + W.look));
          add(B.Head.rotation, 'z', WTUNE.tiltSign * W.tilt);
          add(B.Head.position, 'y', -jaw * WTUNE.jawDrop);
        }
        if (B.Neck3) add(B.Neck3.rotation, 'x', WTUNE.pitchSign * jaw * WTUNE.neckDip);
        if (B.Neck1) add(B.Neck1.rotation, 'x', WTUNE.pitchSign * W.look * 0.4);
        if (B.Torso) add(B.Torso.rotation, 'x', Math.sin(t * (2 * Math.PI / 3.6)) * 0.012);
        // Ears: perk splay + the blink-equivalent (a quick single-ear flick).
        let flick = 0;
        if (W.flickT0 < 0 && ts > W.flickAt) { W.flickT0 = ts; W.flickEar = Math.random() < 0.5 ? 'L' : 'R'; }
        if (W.flickT0 >= 0) {
          const p = (ts - W.flickT0) / 240;
          if (p >= 1) { W.flickT0 = -1; W.flickAt = ts + 2400 + Math.random() * 3200; }
          else flick = Math.sin(p * Math.PI);
        }
        const earSwing = Math.sin(t * 0.9) * 0.03 * (1 - W.perk * 0.5);
        if (B['Ear1.L']) {
          add(B['Ear1.L'].rotation, 'z', WTUNE.earSplay * W.perk + earSwing +
            (W.flickEar === 'L' ? flick * 0.35 : 0));
          add(B['Ear1.L'].rotation, 'x', -WTUNE.earBack * W.perk);
        }
        if (B['Ear1.R']) {
          add(B['Ear1.R'].rotation, 'z', -WTUNE.earSplay * W.perk - earSwing -
            (W.flickEar === 'R' ? flick * 0.35 : 0));
          add(B['Ear1.R'].rotation, 'x', -WTUNE.earBack * W.perk);
        }
        // Tail wag: faster and wider when greeting or talking.
        const wagSpeed = cur === 'make' ? 10 : (PUP.speech ? 6.5 : 2.4);
        const wagAmp = cur === 'make' ? 0.5 : (PUP.speech ? 0.36 : 0.16);
        W.wagPhase += dt * wagSpeed;
        if (B.Tail1) add(B.Tail1.rotation, 'y', Math.sin(W.wagPhase) * wagAmp);
        if (B.Tail2) add(B.Tail2.rotation, 'y', Math.sin(W.wagPhase - 0.7) * wagAmp * 0.7);
        renderer.render(scene, camera);
        W.errStreak = 0;
      } catch (e) {
        W.errStreak += 1;
        WDIAG.err = String((e && e.message) || e);
        if (W.errStreak > 5) worldDisable();
      }
    }
    worldEnable();
    renderer.setAnimationLoop(tick);
  } catch (e) { worldFail('build', e); }
})();
</script>
<script>
// ---- LiveKit transport: connect, publish the world canvas, take state ----
// Runs after the world module. Publishing waits for the world to be live
// so subscribers never see a black tile; if the world failed, the status
// line already says why and nothing is published.
(async () => {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const LK_URL = qs.get('liveKitUrl') || qs.get('url') || qs.get('wsUrl') || '';
  const LK_TOKEN = qs.get('token') || '';
  try {
    if (!window.LivekitClient) throw new Error('livekit sdk failed to load');
    if (!LK_URL || !LK_TOKEN) throw new Error('missing liveKitUrl/token URL params');

    // Wait for the world (max ~75s; the model load has a 25s timeout of
    // its own). WDIAG.err set with stage != 'live' is a terminal failure.
    const t0 = Date.now();
    for (;;) {
      const d = window.__lashWorldDiag;
      if (d && d.stage === 'live') break;
      if (d && d.err && d.stage !== 'live') throw new Error('world failed: ' + d.err);
      if (Date.now() - t0 > 75000) throw new Error('world not live after 75s');
      await sleep(400);
    }
    const fb = document.getElementById('fallback');
    if (fb) fb.style.display = 'none';
    setStageState(stageState);   // re-apply now that worldSetState is real

    const canvas = document.querySelector('#world3d canvas');
    if (!canvas) throw new Error('world canvas not found');

    const room = new LivekitClient.Room({ adaptiveStream: false, dynacast: false });
    room.on('dataReceived', (payload, participant, kind, topic) => {
      if (topic !== 'lash/stage') return;
      try {
        const m = JSON.parse(new TextDecoder().decode(payload));
        if (m && m.state) setStageState(m.state);
      } catch (e) { /* malformed packet: ignore */ }
    });
    room.on('disconnected', () => {
      LK.connected = false; LK.publishing = false; refreshStatus();
    });
    room.on('reconnected', () => { LK.connected = true; refreshStatus(); });

    await room.connect(LK_URL, LK_TOKEN);
    LK.connected = true;
    LK.identity = room.localParticipant && room.localParticipant.identity;
    refreshStatus();

    const stream = canvas.captureStream(30);
    const mst = stream.getVideoTracks()[0];
    if (!mst) throw new Error('captureStream produced no video track');
    await room.localParticipant.publishTrack(mst, {
      name: 'stage',
      source: LivekitClient.Track.Source.Camera,
      videoEncoding: { maxBitrate: 2500000, maxFramerate: 30 },
    });
    LK.publishing = true;
    refreshStatus();
    window.__lashRoom = room;
  } catch (e) {
    LK.err = String((e && e.message) || e);
    refreshStatus();
  }
})();
</script>
