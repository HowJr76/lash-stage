<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lash · Moseley Innovations</title>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script type="importmap">
{"imports": {
  "three": "./three.module.js",
  "three/addons/": "./addons/"
}}
</script>
<style>
  html, body { margin:0; height:100%; background:radial-gradient(1200px 700px at 50% -10%, #0d2c47 0%, #081c30 45%, #050f1c 100%); color:#e8eef2;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; box-sizing:border-box; }
  #face { width:220px; height:220px; border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:110px; border:4px solid #17b6c9; transition: box-shadow .25s;
    overflow:hidden; }
  #face video { width:100%; height:100%; object-fit:cover; display:block; }
  #face canvas { width:100%; height:100%; display:block; }
  /* Loops readability (stage v9.2, Fix Round 2): in loops mode the
     four state clips STACK and crossfade (opacity) instead of
     hard-cutting. Gated on the data attribute — set only in loops
     mode — so puppet/world paths, which share these elements and
     the #face className, keep their original rendering untouched. */
  #face[data-loops="1"] { position:relative; }
  #face[data-loops="1"] video { position:absolute; inset:0; opacity:0;
    transition: opacity .2s ease-in-out; }
  #face.speaking { box-shadow: 0 0 0 10px rgba(23,182,201,.25), 0 0 60px rgba(23,182,201,.35);
    animation: talkbob .9s ease-in-out infinite; }
  @keyframes talkbob { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  #face.listening { box-shadow: 0 0 0 8px rgba(120,255,170,.18); }
  #name { font-size:28px; font-weight:600; letter-spacing:.02em; }
  #name .name-brand { color:#17b6c9; }
  /* Moseley Innovations brand strip (skin only — no layout/JS changes) */
  #brand { display:flex; align-items:center; gap:10px; margin-top:4px; opacity:.9; }
  #brand img { width:30px; height:30px; border-radius:8px; border:1px solid rgba(23,182,201,.5); display:block; }
  #brand span { font-size:13px; font-weight:700; letter-spacing:.18em; color:#cfe6ee; }
  #brand em { font-style:normal; font-size:11px; font-weight:600; letter-spacing:.22em; color:#17b6c9; }
  #status { font-size:15px; color:#9fb2c1; min-height:20px; }
  #caption { max-width:900px; text-align:center; font-size:20px; line-height:1.45;
    color:#d7e3ec; min-height:56px; }
  #heard { max-width:900px; text-align:center; font-size:16px; color:#7f95a7;
    min-height:22px; font-style: italic; }
</style>
</head>
<body>
<div id="wrap">
  <div id="face"><div id="world3d" style="display:none;width:100%;height:100%"></div><canvas id="puppetCanvas" width="900" height="900" style="display:none"></canvas><video id="faceVideo" src="lash-face.mp4" poster="lash-face.jpg" autoplay muted loop playsinline></video><video id="faceTalk" src="lash-talk.mp4" muted loop playsinline preload="auto" style="display:none"></video><video id="faceWork" src="lash-work.mp4" muted loop playsinline preload="auto" style="display:none"></video><video id="faceMake" src="lash-make.mp4" muted loop playsinline preload="auto" style="display:none"></video></div>
  <div id="name">Lash <span class="name-brand">· Moseley Innovations</span></div>
  <div id="status">connecting…</div>
  <div id="caption"></div>
  <div id="heard"></div>
  <div id="brand"><img src="mi-logo.jpg" alt="Moseley Innovations logo"><span>MUSE IN A MEETING</span><em>BY MOSELEY INNOVATIONS</em></div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const token = qs.get('t') || '';
const face = document.getElementById('face');
const statusEl = document.getElementById('status');
const captionEl = document.getElementById('caption');
const heardEl = document.getElementById('heard');

const queue = [];
let playing = false;
let currentAudio = null;
let currentText = '';
let currentItem = null;   // queue item actually playing (accounting)

// Puppet state (stage v6) — declared early; the engine lives below the
// face-state code. PUP.on stays false until every mandatory layer has
// loaded, and every puppet failure path leaves the v5 medallion alone.
const PUP = {
  on: false, imgs: {}, speech: null, ctx: null,
  jaw: 0, perk: 0, perkVel: 0, tilt: 0, tiltVel: 0,
  blinkAt: 2600, blinkT0: -1, bounceT0: -1, lastTs: 0,
};

// 3D world state (stage v7) — a WebGL room + rigged dog rendered inside
// the medallion by the module script at the bottom of this page. WORLD.on
// flips true only after the scene AND model are fully ready; every
// failure before that leaves v6/v5 exactly as they were.
const WORLD = { on: false };

// Face ownership (stage v9, Howard 2026-10-15): the v5 animated loops —
// the Muse-styled animated GIFs of Lash — OWN the medallion by default;
// they are the avatar Howard likes best. The v6–v8 2D puppet is retired
// by his decision and the v7 3D world is not selected. Both engines stay
// in this file, intact and re-enableable (?fx=puppet / ?fx=world), but
// in the default path neither may take the face over: the puppet loader
// doesn't even fetch its layers, and the world module never builds.
const FX = (qs.get('fx') || 'loops').toLowerCase();
const LOOPS_MODE = FX !== 'puppet' && FX !== 'world';
window.__LASH_LOOPS_MODE__ = LOOPS_MODE;

function setStatus(s) { statusEl.textContent = s; }

// Face media fallback: if the video can't load (e.g. local relay serving),
// fall back to the emoji so the stage never shows a broken medallion.
try {
  const fv = document.getElementById('faceVideo');
  fv.addEventListener('error', () => { if (!PUP.on && !WORLD.on) face.textContent = '🐶'; }, true);
  const p = fv.play && fv.play();
  if (p && p.catch) p.catch(() => {});
} catch (e) { /* the poster/emoji world still works */ }

// ---- transport selection ----
// GitHub-mailbox mode (?gh=<owner/repo>&pat=<token>&session=<id>): production.
// Two append-only streams in one private repo, one writer each:
//   sessions/<id>/u/*  Howard's lines   (this page writes, the bridge reads)
//   sessions/<id>/s/*  Lash's lines     (the bridge writes, this page reads)
//   sessions/<id>/a/*  rendered speech audio for the s/ entries
//   sessions/<id>/c/*  control notes (barge-in, session end)
// Relay-WS mode is the local-test transport.
const GH = qs.get('gh');
const PAT = qs.get('pat');
const SESSION = qs.get('session') || 'dev-session';
const BRANCH = qs.get('branch') || 'main';
const ghMode = !!(GH && PAT);
const GH_API = `https://api.github.com/repos/${GH}`;
const SESS = `sessions/${SESSION}`;

// ---- live-wire mode (?live=<ably key>): Phase 2 production transport ----
// Ably channels lash-<session>-up (this page publishes utterances/control)
// and lash-<session>-down (speech lines + binary audio frames). GitHub
// stays as the archive, written by the bridge — not the road.
const LIVE_KEY = qs.get('live');
const liveMode = !!LIVE_KEY;
let upCh = null, downCh = null;
const pendingLines = new Map();
const pendingAudio = new Map();

// ---- latency trace (2026-10-15 latency rescue; log-only) ----
// In-page event stamps: window.__lashTrace collects
// {ev, seq, t (performance.now ms), wall (Date.now epoch ms)} so the
// harness and trace_report.py can size the stage spans (publish ->
// queued -> play_start -> play_end). play_start/play_end are also
// published up the wire as control notes — the bridge logs their
// receipt, which gives live sessions the playback spans tonight's
// logs could not account for at all.
window.__lashTrace = [];
function lashTrace(ev, seq, extra) {
  try {
    window.__lashTrace.push(Object.assign(
      {ev, seq: (seq == null ? null : seq),
       t: Math.round(performance.now() * 10) / 10, wall: Date.now()},
      extra || {}));
    if (window.__lashTrace.length > 600) window.__lashTrace.shift();
  } catch (e) { /* tracing must never break the stage */ }
  if ((ev === 'play_start' || ev === 'play_end') && upCh) {
    // Playback accounting rides these notes (stage v9.3): play_end
    // carries pos_ms/dur_ms (where playback stopped, from the audio
    // element's own clock) and stopped=true when the line was CUT
    // (barge-in/flush) rather than played out — the bridge splits
    // the line into heard/unheard at exactly that position.
    try { upCh.publish('control', Object.assign(
      {type: ev, seq: seq, wall: Date.now()}, extra || {}));
    } catch (e) {}
  }
}
// Emit a line's play_end exactly once, whichever way it ends.
function emitPlayEnd(item, stopped) {
  if (!item || item._playEndSent) return;
  item._playEndSent = true;
  let pos = null, dur = null;
  if (currentAudio) {
    try {
      if (isFinite(currentAudio.currentTime))
        pos = Math.round(currentAudio.currentTime * 1000);
      if (isFinite(currentAudio.duration))
        dur = Math.round(currentAudio.duration * 1000);
    } catch (e) { /* no clock (text lane): position stays unknown */ }
  }
  lashTrace('play_end', item.seq,
            {pos_ms: pos, dur_ms: dur, stopped: !!stopped});
}
// Filler queue guard: a queued, not-yet-playing filler must never sit
// ahead of a substantive line (the consult's queueing finding — an
// acknowledgment occupying the playback queue delays the real answer
// behind it). When substance arrives, queued fillers are preempted.
// Disable with ?fqguard=0.
const FQ_GUARD = qs.get('fqguard') !== '0';
function preemptQueuedFillers() {
  if (!FQ_GUARD) return;
  for (let i = queue.length - 1; i >= 0; i--) {
    if (queue[i].filler) {
      lashTrace('filler_preempted', queue[i].seq);
      queue.splice(i, 1);
    }
  }
}
function pairSpeech(seq) {
  const line = pendingLines.get(seq);
  if (!line) return;
  const url = pendingAudio.get(seq);
  // Oversized lines travel by reference instead of an inline frame
  // (Ably's 65,536-byte cap): the line carries gh_audio_path and
  // playNext fetches the MP3 through the existing gh playback path.
  if (!url && !line.gh_audio_path) return;
  pendingLines.delete(seq);
  pendingAudio.delete(seq);
  if (!line.filler) preemptQueuedFillers();
  queue.push({seq, text: line.text, audio_url: url || null,
              gh_audio_path: line.gh_audio_path || null,
              env: line.env || null, filler: !!line.filler});
  lashTrace('queued', seq);
  playNext();
}
if (liveMode && window.Ably) {
  try {
    const ably = new Ably.Realtime({key: LIVE_KEY, clientId: 'stage'});
    upCh = ably.channels.get(`lash-${SESSION}-up`);
    downCh = ably.channels.get(`lash-${SESSION}-down`);
    ably.connection.on('connected', () => {
      setStatus('listening (live)');
      face.className = 'listening';
      publishHello();
      // Greeting (stage v9): the playful standing portrait owns the
      // medallion only inside this bounded window after connect, and
      // only until the first real event — an utterance, a thinking
      // signal, or speech — supersedes it via faceRefresh(). The timer
      // is a bound, never the driver.
      greetingUntil = Date.now() + GREET_MS;
      faceRefresh();
      setTimeout(faceRefresh, GREET_MS + 60);
    });
    ably.connection.on('failed', () => setStatus('live wire failed'));
    downCh.subscribe('line', (m) => {
      lashTrace('line_recv', m.data.seq);
      pendingLines.set(m.data.seq, m.data);
      setTimeout(() => pendingLines.delete(m.data.seq), 8000);
      pairSpeech(m.data.seq);
    });
    downCh.subscribe('audio', (m) => {
      try {
        const buf = m.data;
        const seq = new DataView(buf).getUint32(0);
        lashTrace('audio_recv', seq);
        const blob = new Blob([buf.slice(4)], {type: 'audio/mpeg'});
        pendingAudio.set(seq, URL.createObjectURL(blob));
        setTimeout(() => pendingAudio.delete(seq), 8000);
        pairSpeech(seq);
      } catch (e) { /* bad frame — skip */ }
    });
    downCh.subscribe('flush', () => { lashTrace('flush_recv'); stopPlayback(); });
    downCh.subscribe('say_text', (m) => {
      if (!m.data.filler) preemptQueuedFillers();
      queue.push({seq: m.data.seq, kind: 'text', text: m.data.text,
                  voiceName: m.data.voiceName || null,
                  rate: m.data.rate || 1.0, pitch: m.data.pitch ?? 1.0,
                  filler: !!m.data.filler});
      lashTrace('queued', m.data.seq);
      playNext();
    });
    // Face-state signals from the bridge (stage v9): 'thinking' is
    // published the moment an utterance reaches the bridge and the
    // brain starts composing; 'done' when the turn's lines have all
    // shipped. The signals only move the state machine's flags — the
    // visible loop is always resolved by faceRefresh(), so a thinking
    // signal that lands mid-playback is remembered, not dropped, and
    // takes the face the instant playback ends.
    let thinkFailsafe = null;
    downCh.subscribe('face', (m) => {
      if (!m.data) return;
      if (m.data.state === 'thinking') {
        faceThinking = true;
        greetingUntil = 0;
        clearTimeout(thinkFailsafe);
        // Failsafe only: if the brain dies mid-compose (it has), the
        // work loop must not stare forever.
        thinkFailsafe = setTimeout(() => {
          faceThinking = false; faceRefresh();
        }, 25000);
        faceRefresh();
      } else if (m.data.state === 'done' || m.data.state === 'listening') {
        faceThinking = false;
        clearTimeout(thinkFailsafe);
        faceRefresh();
      }
    });
  } catch (e) { setStatus('live wire error'); }
}

// ---- capability handshake ----
// Announce this browser's speech-synthesis inventory up the wire so the
// bridge can negotiate a voice profile and use the text lane (speak here)
// instead of shipping rendered audio. Republish as voices load.
let helloCount = 0;
let lastVoiceSig = '';
// World telemetry (v7.1): what the 3D layer is doing in THIS browser —
// the local test harness could not see CDN/WebGL reality, so the stage
// now reports it up the wire in every hello.
function worldTelemetry() {
  // Stage v9: in loops mode the world is not selected — say so plainly
  // instead of leaving the bridge to log a forever-'pending' layer.
  if (LOOPS_MODE) return { state: 'loops', stage: 'loops', err: null,
    webgl: false, gl: null, glKind: null, three: 'skipped',
    model: 'skipped', bones: 0, frames: 0, hidden: document.hidden,
    errors: [] };
  const d = window.__lashWorldDiag;
  if (!d) return { state: 'absent' };
  return {
    state: WORLD.on ? 'engaged' : (d.err ? 'failed' : 'pending'),
    stage: d.stage, err: d.err,
    webgl: !!d.webgl, gl: d.gl || null, glKind: d.glKind || null,
    three: d.threeImport || 'pending',
    model: d.modelFetch || 'pending',
    bones: (d.bones || []).length,
    frames: d.frames || 0,
    hidden: document.hidden,
    errors: (d.errors || []).slice(0, 4),
  };
}
function publishHello(force) {
  if (!upCh) return;
  if (!force && helloCount >= 4) return;
  let voices = [];
  try {
    voices = (window.speechSynthesis ? speechSynthesis.getVoices() : [])
      .map(v => ({name: v.name, lang: v.lang,
                  localService: !!v.localService, isDefault: !!v.default}));
  } catch (e) { /* no synthesis in this browser */ }
  const sig = voices.map(v => v.name).join('|');
  if (!force && sig === lastVoiceSig && helloCount > 0) return;
  lastVoiceSig = sig;
  helloCount += 1;
  let world = null;
  try { world = worldTelemetry(); } catch (e) { /* telemetry must never break hello */ }
  upCh.publish('hello', {voices, ua: navigator.userAgent, ts: Date.now(), world,
                         caps: {audio_ref: 1}});
}
window.__lashHello = () => publishHello(true);
// Re-publish hello whenever the world state changes (engaged / failed /
// stage transitions) so the bridge log captures the resolution.
let lastWorldPubSig = '';
let worldWatchTicks = 0;
const worldWatch = setInterval(() => {
  try {
    if (++worldWatchTicks > 48) { clearInterval(worldWatch); return; }
    if (!window.__lashWorldDiag) return;
    const w = worldTelemetry();
    const s = [w.state, w.stage, w.err, w.three, w.model].join('|');
    if (s !== lastWorldPubSig) { lastWorldPubSig = s; publishHello(true); }
  } catch (e) { /* watcher must never throw into the stage */ }
}, 2500);
try {
  if (window.speechSynthesis)
    speechSynthesis.onvoiceschanged = () => publishHello();
} catch (e) { /* ignore */ }

// ---- relay websocket (local-test transport) ----
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const relay = (ghMode || liveMode)
  ? { readyState: 0, send: () => {} }
  : new WebSocket(`${proto}//${location.host}/stage-ws?t=${token}`);
if (!ghMode && !liveMode) {
relay.onopen = () => setStatus('listening');
relay.onclose = () => setStatus('relay disconnected');
relay.onmessage = (ev) => {
  let m; try { m = JSON.parse(ev.data); } catch { return; }
  if (m.type === 'say') {
    queue.push(m);
    playNext();
  } else if (m.type === 'flush') {
    stopPlayback();
  } else if (m.type === 'heard') {
    heardEl.textContent = m.speaker + ': ' + m.text;
  } else if (m.type === 'session_end') {
    stopPlayback();
    setStatus('session ended');
  }
};
} // end if (!ghMode)

// Face animation system: the medallion carries Lash's full set of
// animated portraits and swaps by state —
//   idle  = seated portrait (listening)
//   talk  = close-up portrait (speaking)
//   work  = headphones at the laptop (thinking / composing a reply)
//   make  = standing, playful (greeting on arrival)
const FACE_VIDS = { idle: 'faceVideo', talk: 'faceTalk', work: 'faceWork', make: 'faceMake' };
let faceState = 'idle';
// Loops readability (stage v9.2, Fix Round 2 — Howard in-room during
// the v9 test: the state loops "wasn't supposed to be random"). The
// v9 state machine resolved correctly (telemetry proved it), but the
// SWITCHING read as random to the eye: hard cuts, every entry joining
// its clip mid-loop at an arbitrary frame, no minimum dwell. Three
// mechanical fixes, loops mode only:
//   ENTRY IN-POINTS — a state starts its clip at a defined in-point
//     (FACE_SPAN), the same frame every time, so each state's opening
//     gesture becomes recognizable.
//   CROSSFADE — 200 ms opacity blend instead of a hard cut.
//   MINIMUM HOLD — a non-preempting state must dwell 1.6 s before it
//     can be replaced, so brief signals can't flicker the face.
//     TALKING preempts instantly in both directions (it must track
//     playback exactly); THINKING preempts idle/greeting instantly.
// FACE_SPAN in/out points come from a per-clip motion audit
// (2026-10-16; mean abs frame-diff per 0.5 s bucket):
//   idle: calm (<=0.52) EXCEPT a distinct movement burst at
//     1.5-2.5 s (1.12) and a rise at 7.5-8.0 s — in the old full-loop
//     usage the LISTENING face made a big unexplained move every
//     8 s, a concrete contributor to the "random" read. The loop
//     window is set to the calm 2.5-7.5 s segment.
//   talk: near-still 0-2.0 s, speech motion 2.0-5.0 s — entry at
//     2.0 s puts the talking motion under the audio from frame one.
//   work: busy throughout except a still first 0.5 s — entry at
//     0.5 s so THINKING reads instantly.
//   make: busy/playful throughout — full span.
const FACE_SPAN = {
  idle: { i: 2.5, o: 7.5 },
  talk: { i: 2.0, o: 7.9 },
  work: { i: 0.5, o: 7.9 },
  make: { i: 0.0, o: 7.9 },
};
const FACE_FADE_MS = 200;
const FACE_MIN_HOLD_MS = 1600;
let faceVisible = 'idle';
let faceShownAt = performance.now();
let faceHoldTimer = null;
// Intentional state machine (stage v9): the visible loop is RESOLVED
// from real signals at every event, never advanced by timers —
//   TALKING   exactly while a speech line is playing (the playNext span)
//   THINKING  while the bridge says the brain is composing (its 'face'
//             thinking signal, published at utterance receipt; 'done'
//             clears it when the turn's lines have all shipped)
//   GREETING  only inside the bounded post-connect window, and only
//             until the first real event supersedes it
//   LISTENING at all other times
// Priority: talk > thinking > greeting > idle. Timers exist only as
// bounds and failsafes (greeting expiry, a stuck-thinking failsafe),
// never as the thing that moves the face.
let faceThinking = false;
let greetingUntil = 0;
const GREET_MS = 6000;
function faceResolve() {
  if (playing) return 'talk';
  if (faceThinking) return 'work';
  if (Date.now() < greetingUntil) return 'make';
  return 'idle';
}
function faceRefresh() { faceShow(faceResolve()); }
function faceShow(name) {
  try {
    if (!FACE_VIDS[name]) name = 'idle';
    faceState = name;
    if (WORLD.on) { worldSetState(name); return; }
    if (PUP.on) { puppetSetState(name); return; }
    if (LOOPS_MODE) { faceShowLoops(name); return; }
    for (const [k, id] of Object.entries(FACE_VIDS)) {
      const el = document.getElementById(id);
      if (!el) continue;
      if (k === name) { el.style.display = 'block'; const p = el.play(); if (p && p.catch) p.catch(() => {}); }
      else { el.style.display = 'none'; try { el.pause(); } catch (e) {} }
    }
  } catch (e) { /* medallion keeps whatever portrait it has */ }
}
// Loops-mode switching (stage v9.2): crossfade at defined in-points
// with a minimum hold — see the FACE_SPAN block for the why.
function faceShowLoops(name) {
  if (name === faceVisible) {
    if (faceHoldTimer) { clearTimeout(faceHoldTimer); faceHoldTimer = null; }
    return;
  }
  const now = performance.now();
  const cur = faceVisible;
  // Preemption: talking enters/leaves with playback exactly; thinking
  // takes the face from idle/greeting without waiting out a hold.
  const preempt = !cur || name === 'talk' || cur === 'talk'
    || name === 'work';
  if (!preempt && now - faceShownAt < FACE_MIN_HOLD_MS) {
    if (!faceHoldTimer) {
      faceHoldTimer = setTimeout(() => {
        faceHoldTimer = null;
        try { faceShow(faceResolve()); } catch (e) {}
      }, FACE_MIN_HOLD_MS - (now - faceShownAt) + 20);
    }
    return;
  }
  if (faceHoldTimer) { clearTimeout(faceHoldTimer); faceHoldTimer = null; }
  const inEl = document.getElementById(FACE_VIDS[name]);
  if (!inEl) return;
  const outEl = cur ? document.getElementById(FACE_VIDS[cur]) : null;
  faceVisible = name;
  faceShownAt = now;
  if (inEl._fadeT) { clearTimeout(inEl._fadeT); inEl._fadeT = null; }
  try { inEl.currentTime = FACE_SPAN[name].i; } catch (e) {}
  inEl.style.display = 'block';
  inEl.dataset.shown = '1';
  void inEl.offsetWidth;  // reflow: the fade must run from opacity 0
  inEl.style.opacity = '1';
  const p = inEl.play(); if (p && p.catch) p.catch(() => {});
  if (outEl && outEl !== inEl) {
    delete outEl.dataset.shown;
    outEl.style.opacity = '0';
    if (outEl._fadeT) clearTimeout(outEl._fadeT);
    outEl._fadeT = setTimeout(() => {
      if (outEl.dataset.shown !== '1') {
        outEl.style.display = 'none';
        try { outEl.pause(); } catch (e) {}
      }
    }, FACE_FADE_MS + 60);
  }
}
// Loops init (stage v9.2): mark the medallion for the stacked CSS,
// show the idle clip at full opacity inside its calm window, and
// window every clip to its FACE_SPAN while it is the visible one.
if (LOOPS_MODE) {
  try {
    face.dataset.loops = '1';
    const idleEl = document.getElementById(FACE_VIDS.idle);
    if (idleEl) {
      idleEl.dataset.shown = '1';
      idleEl.style.opacity = '1';
      const jump = () => { try { idleEl.currentTime = FACE_SPAN.idle.i; } catch (e) {} };
      if (idleEl.readyState >= 1) jump();

function synthEnvelope(text, seconds) {
  const words = (text || '').split(/\s+/).filter(Boolean);
  const syl = [];
  for (const w of words) {
    const groups = (w.toLowerCase().match(/[aeiouy]+/g) || []).length;
    syl.push(Math.max(1, Math.min(4, groups || 1)));
  }
  const total = syl.reduce((a, b) => a + b, 0) || 1;
  const win = 0.06, n = Math.max(1, Math.ceil(seconds / win));
  const env = new Array(n).fill(0);
  let t = 0.02, seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (const s of syl) {
    const dt = seconds * (s / total);
    const peak = 0.45 + rnd() * 0.5;
    for (let k = 0; k < 3; k++) {
      const idx = Math.floor((t + k * win) / win);
      if (idx < n) env[idx] = Math.max(env[idx], peak * (1 - k * 0.3));
    }
    t += dt;
  }
  return env;
}

function pupProfile(y) {
  const W = PUP_WARP;
  if (y <= W.y) return 0;
  // Ramp compressed x1.5 (2026-10-15 jaw-visibility fix): displacement
  // must arrive AT the mouth band, not only deep in the beard — with
  // the old linear ramp the mouth line itself moved ~2px at full jaw
  // and the motion was invisible at Meet tile sizes (harness-measured).
  if (y <= W.peakY) { const t = Math.min(1, (y - W.y) / (W.peakY - W.y) * (W.ramp || 1.5)); return t * t * (3 - 2 * t); }
  return Math.max(0.45, 1 - 0.55 * (y - W.peakY) / (W.y + W.h - W.peakY));

      const idx = Math.floor(ct / 0.06);

      if (s.mode !== 'audio' && ct > s.env.length * 0.06 + 0.3) PUP.speech = null;

    PUP.jaw += (amp - PUP.jaw) * (amp > PUP.jaw ? 0.55 : 0.30);
    if (PUP.jaw < 0.003 && !PUP.speech) PUP.jaw = 0;

    const dt = Math.min(0.05, PUP.lastTs ? (ts - PUP.lastTs) / 1000 : 0.016);
    PUP.lastTs = ts;
    const spring = (x, v, target, stiff, damp) => {
      v += ((target - x) * stiff - v * damp) * dt;
      x += v * dt;
      return [x, v];

    let blink = 0;
    if (PUP.blinkT0 < 0 && ts > PUP.blinkAt) PUP.blinkT0 = ts;
    if (PUP.blinkT0 >= 0) {
      const p = (ts - PUP.blinkT0) / 170;
      if (p >= 1) { PUP.blinkT0 = -1; PUP.blinkAt = ts + 2400 + Math.random() * 3000; }
      else blink = Math.sin(p * Math.PI);

    const breathe = Math.sin(t * (2 * Math.PI / 3.6));
    let bounceY = 0;
    if (PUP.bounceT0 >= 0) {
      const p = (ts - PUP.bounceT0) / 900;
      if (p >= 1) PUP.bounceT0 = -1;
      else bounceY = -Math.sin(p * Math.PI) * 12;
    }
    const nod = Math.max(-1.1, Math.min(1.1, (PUP.jaw - 0.35) * 1.6));
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 900, 900);
    ctx.save();
    ctx.translate(PUP_PIVOT[0], PUP_PIVOT[1]);
    ctx.rotate((PUP.tilt + nod) * Math.PI / 180);
    ctx.scale(1, 1 + breathe * 0.005);
    ctx.translate(-PUP_PIVOT[0], -PUP_PIVOT[1]);
    ctx.translate(0, breathe * 1.4 + bounceY);
    const base = PUP.imgs.base;
    ctx.drawImage(base, 0, 0);
    if (PUP.jaw > 0.02) {
      const W = PUP_WARP;
      for (let y0 = W.y; y0 < W.y + W.h; y0 += W.step) {
        const off = pupProfile(y0 + W.step / 2) * W.travel * PUP.jaw;
        if (off < 0.2) continue;
        ctx.drawImage(base, W.x, y0, W.w, W.step + (W.overlap || 6),
                      W.x, y0 + off, W.w, W.step + (W.overlap || 6));

      // (2026-10-15): at alpha 0.34 it measured +1.8 luminance against
      // the closed mouth, i.e. no visible oral cavity at all.
      const SR = W.shadowR || 95;
      const g = ctx.createRadialGradient(W.mx, W.my, 4, W.mx, W.my, SR);
      g.addColorStop(0, `rgba(26,18,12,${(W.shadowA || 0.60) * PUP.jaw})`);
      g.addColorStop(1, 'rgba(26,18,12,0)');

      ctx.rotate(rot * Math.PI / 180);
      ctx.translate(-E.px, -E.py);
      ctx.drawImage(img, E.dx, E.dy);
      ctx.restore();

      ctx.globalAlpha = blink;
      if (PUP.imgs.blinkL) ctx.drawImage(PUP.imgs.blinkL, PUP_BLINK.L[0], PUP_BLINK.L[1]);

async function playNext() {
  if (playing || queue.length === 0) return;
  const item = queue.shift();
  lashTrace('play_start', item.seq, {pos_ms: 0});
  playing = true;
  currentItem = item;

    // Text lane: this browser speaks. Negotiated voice, MP3 fallback is
    // the bridge's job (triggered by the synth_error report below).
    try {
      const voices = speechSynthesis.getVoices();
      const v = voices.find(x => x.name === item.voiceName)
             || voices.find(x => x.lang && x.lang.startsWith('en'))
             || voices[0];
      if (!v) throw new Error('no voices');
      const u = new SpeechSynthesisUtterance(item.text);
      u.voice = v;
      u.rate = item.rate || 1.0;
      u.pitch = item.pitch ?? 1.0;
      u.onend = () => {
        if (upCh) upCh.publish('control',
          {type: 'speech_done', seq: item.seq, ok: true});
        donePlaying(item);

      u.onerror = (ev) => {
        if (upCh) upCh.publish('control',
          {type: 'synth_error', seq: item.seq, error: String(ev.error || 'synth')});
        donePlaying(item);
      };
      speechSynthesis.speak(u);
      puppetLineStart(item);
    } catch (e) {
      if (upCh) upCh.publish('control',
        {type: 'synth_error', seq: item.seq, error: String(e && e.message || e)});
      donePlaying(item);
    }
    return;
  }
  try {
    let url = item.audio_url;
    if (item.gh_audio_path) url = await ghRawObjectURL(item.gh_audio_path);
    currentAudio = new Audio(url);
    currentAudio.onended = () => donePlaying(item);
    currentAudio.onerror = () => donePlaying(item);
    puppetLineStart(item);
    await currentAudio.play();

  currentItem = null;
  currentAudio = null;

function ghHeaders(extra) {
  return Object.assign({Authorization: `Bearer ${PAT}`,
                        Accept: 'application/vnd.github+json'}, extra || {});
}
function b64utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64bytes(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function ghPut(path, base64Content, message) {
  try {
    await fetch(`${GH_API}/contents/${path}`, {
      method: 'PUT', headers: ghHeaders({'Content-Type': 'application/json'}),
      body: JSON.stringify({message, content: base64Content, branch: BRANCH}),
    });
  } catch (e) { /* transient; the conversation carries on */ }
}
function ghPutJSON(path, obj) {
  return ghPut(path, b64utf8(JSON.stringify(obj)), `mailbox ${path}`);
}
async function ghRaw(path) {
  const r = await fetch(`${GH_API}/contents/${path}?ref=${BRANCH}`, {
    headers: ghHeaders({Accept: 'application/vnd.github.raw+json'})});
  if (!r.ok) throw new Error('gh raw ' + r.status);
  return r;
}
async function ghRawObjectURL(path) {
  const r = await ghRaw(path);
  const blob = await r.blob();
  return URL.createObjectURL(blob);
}

if (ghMode && !liveMode) {
  setStatus('listening');
  face.className = 'listening';
  let etag = null;
  const seenSpeeches = new Set();
  setInterval(async () => {
    try {
      const headers = ghHeaders();
      if (etag) headers['If-None-Match'] = etag;
      const r = await fetch(`${GH_API}/git/trees/${BRANCH}?recursive=1`, {headers});
      if (r.status === 304) return;
      if (!r.ok) return;
      etag = r.headers.get('ETag');
      const data = await r.json();
      const prefix = `${SESS}/s/`;
      const entries = (data.tree || [])
        .filter(e => e.type === 'blob' && e.path.startsWith(prefix) && e.path.endsWith('.json'))
        .sort((a, b) => a.path < b.path ? -1 : 1);
      for (const e of entries) {
        if (seenSpeeches.has(e.path)) continue;
        seenSpeeches.add(e.path);
        try {
          const resp = await ghRaw(e.path);
          const row = await resp.json();
          queue.push({seq: row.seq, kind: row.kind, text: row.text,
                      gh_audio_path: row.audio || null});
        } catch (err) { /* skip a bad entry */ }
      }
      if (entries.length) playNext();
    } catch (e) { /* poll again next tick */ }
  }, 1000);
}

// The asset has NO jaw bone and a single mesh, so per the spike rule the
// jaw is amplitude-driven head/muzzle motion: envelope -> head dip +
// neck dip + a small head drop, which reads as jaw movement at tile
// size. Ears (Ear1.L/R), head tilt, tail wag and the baked clips
// (Idle / Idle_2 / Idle_2_HeadLow / Jump_ToIdle) carry the rest.
//
// FALLBACK IS SACRED: no WebGL, CDN failure, model failure, or repeated
// runtime errors all leave WORLD.on false (or flip it back off) and the
// v6 puppet / v5 medallion run the call untouched. This layer can never
// produce a black or broken tile.
const WDIAG = { webgl: false, stage: 'boot', err: null, gl: null, glKind: null,
                bones: [], clips: [], frames: 0,
                threeImport: 'pending', modelFetch: 'pending', errors: [] };
window.__lashWorldDiag = WDIAG;
// v7.1 telemetry: capture the first errors of the page's life (the world
// init window) and re-publish hello at every world resolution so the
// bridge log shows what actually happened in the real browser.
const worldNotify = () => { try { if (window.__lashHello) window.__lashHello(); } catch (e) {} };
try {
  const cap = (msg) => { try {
    if (WDIAG.errors.length < 6) WDIAG.errors.push(String(msg).slice(0, 240));
  } catch (e) {} };
  window.addEventListener('error', (ev) => {
    if (performance.now() < 40000) cap('onerror: ' + (ev.message || ev.type || 'unknown'));
  });
  window.addEventListener('unhandledrejection', (ev) => {
    cap('reject: ' + ((ev.reason && ev.reason.message) || ev.reason || 'unknown'));
  });
} catch (e) { /* capture is best-effort */ }
const DOG_URL = window.__LASH_DOG_URL || 'dog.glb';
const WTUNE = { pitchSign: -1, tiltSign: 1, jawDip: 0.17, jawDrop: 0.012,
                neckDip: 0.09, tiltRad: 0.17, lookDown: 0.22,
                earSplay: 0.22, earBack: 0.12 };
window.__lashWorldTune = WTUNE;
window.worldSetState = () => {};   // real one replaces this during init
const wTimeout = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error('load timeout')), ms));
function worldFail(stage, err) {
  WDIAG.stage = stage;
  WDIAG.err = String((err && err.message) || err || stage);
  if (stage === 'imports' && WDIAG.threeImport === 'pending') WDIAG.threeImport = 'fail';
  if (WDIAG.modelFetch === 'pending' && (stage === 'build' || stage === 'model'))
    WDIAG.modelFetch = 'fail';
  worldNotify();
}

(async () => {
  // Stage v9: the loops own the medallion by default — the world is
  // not selected, so it never probes WebGL, never fetches three.js or
  // the model, and can never take the face over. ?fx=world restores
  // the full v7 build path below, untouched.
  if (window.__LASH_LOOPS_MODE__) {
    WDIAG.stage = 'loops';
    WDIAG.threeImport = 'skipped';
    WDIAG.modelFetch = 'skipped';
    worldNotify();
    return;
  }
  let THREE, GLTFLoader;
  try {
    const probe = document.createElement('canvas');
    // v7.2: ask permissively — a bot browser on software GL can refuse a
    // default-attributes context it would grant with these flags.
    const probeAttrs = { failIfMajorPerformanceCaveat: false,
                         powerPreference: 'low-power', antialias: false };
    let gl = null, glKind = null;
    try { gl = probe.getContext('webgl2', probeAttrs); if (gl) glKind = 'webgl2'; } catch (e) {}
    if (!gl) { try { gl = probe.getContext('webgl', probeAttrs); if (gl) glKind = 'webgl'; } catch (e) {} }
    if (!gl) { try { gl = probe.getContext('experimental-webgl', probeAttrs); if (gl) glKind = 'experimental'; } catch (e) {} }
    if (!gl) { worldFail('webgl', 'no WebGL context in this browser'); return; }
    WDIAG.webgl = true;
    WDIAG.glKind = glKind;
    try {
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      WDIAG.gl = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL))
                     : String(gl.getParameter(gl.RENDERER));
    } catch (e) { WDIAG.gl = 'unknown'; }
    WDIAG.stage = 'imports';
    THREE = await import('three');
    ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
    WDIAG.threeImport = 'ok';
    worldNotify();
  } catch (e) { worldFail('imports', e); return; }

  const B = {};            // bones by name
  const ACT = {};          // animation actions by role
  const W = { jaw: 0, perk: 0, perkVel: 0, tilt: 0, tiltVel: 0,
              look: 0, lookVel: 0, prevSpeech: null, wagPhase: 0,
              flickAt: 2600 + Math.random() * 2600, flickT0: -1, flickEar: 'L',
              jumpUntil: 0, idle2Until: 0, nextIdle2: 9000 + Math.random() * 5000,
              errStreak: 0, applied: [] };
  let renderer = null, scene = null, camera = null, mixer = null, curAction = null;
  let cur = 'idle';

  function worldDisable() {
    if (!WORLD.on) return;
    WORLD.on = false;
    WDIAG.stage = 'disabled-runtime';
    worldNotify();
    const holder = document.getElementById('world3d');
    if (holder) holder.style.display = 'none';
    if (renderer) { try { renderer.setAnimationLoop(null); } catch (e) {} }
    const pc = document.getElementById('puppetCanvas');
    if (PUP.on && pc) pc.style.display = 'block';
    else if (!PUP.on) { try { faceShow(faceState); } catch (e) {} }
  }
  function worldEnable() {
    let holder = document.getElementById('world3d');
    if (!holder) {
      // The emoji fallback may have wiped #face before we were ready;
      // rebuild the holder rather than giving up (same trick as v6).
      face.textContent = '';
      holder = document.createElement('div');
      holder.id = 'world3d';
      holder.style.cssText = 'width:100%;height:100%';
      face.appendChild(holder);
    }
    if (renderer && renderer.domElement.parentNode !== holder)
      holder.appendChild(renderer.domElement);
    const pc = document.getElementById('puppetCanvas');
    if (pc) pc.style.display = 'none';
    for (const id of Object.values(FACE_VIDS)) {
      const el = document.getElementById(id);
      if (el) { el.style.display = 'none'; try { el.pause(); } catch (e) {} }
    }
    holder.style.display = 'block';
    WORLD.on = true;
    WDIAG.stage = 'live';
    worldNotify();
    // One delayed snapshot so the log also shows the rAF frame count —
    // proof the world is actually animating, not just initialized.
    setTimeout(() => worldNotify(), 15000);
    if (window.worldSetState) window.worldSetState(faceState);
  }

  try {
    WDIAG.stage = 'scene';
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
    // updateStyle=false: the stage CSS (#face canvas) sizes the canvas to
    // the medallion; an inline 440px style would overflow the circle and
    // show only one quadrant of the scene.
    renderer.setSize(440, 440, false);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2019);
    scene.fog = new THREE.Fog(0x2b2019, 7, 16);
    camera = new THREE.PerspectiveCamera(34, 1, 0.1, 60);
    scene.add(new THREE.HemisphereLight(0xffe2b8, 0x3d2c1e, 1.15));
    const key = new THREE.DirectionalLight(0xffdfae, 2.4);
    key.position.set(2.2, 3.6, 2.4);
    key.castShadow = true;
    key.shadow.mapSize.set(512, 512);
    key.shadow.camera.left = -2; key.shadow.camera.right = 2;
    key.shadow.camera.top = 3; key.shadow.camera.bottom = -1;
    key.shadow.bias = -0.0004;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x9db8ff, 0.55);
    rim.position.set(-2.5, 1.8, -2.0);
    scene.add(rim);
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(9, 40),
      new THREE.MeshStandardMaterial({ color: 0x74522f, roughness: 0.95 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const rug = new THREE.Mesh(
      new THREE.CircleGeometry(1.02, 40),
      new THREE.MeshStandardMaterial({ color: 0x8a4433, roughness: 1 }));
    rug.rotation.x = -Math.PI / 2;
    rug.position.y = 0.002;
    rug.receiveShadow = true;
    scene.add(rug);

    WDIAG.stage = 'model';
    const loader = new GLTFLoader();
    const gltf = await Promise.race([loader.loadAsync(DOG_URL), wTimeout(25000)]);
    WDIAG.modelFetch = 'ok';
    worldNotify();
    const model = gltf.scene;
    scene.add(model);
    scene.updateMatrixWorld(true);
    // Normalize from the SKELETON, not the mesh bounds: Box3.setFromObject
    // ignores skinning and reads raw geometry (this export's armature
    // carries a x100 scale, so mesh bounds are meaningless). Bone world
    // positions are the truth: height -> 1.0, feet on floor, centered.
    const bonePts = [];
    model.traverse((o) => {
      if (o.isBone && !/^(PoleTarget|IK)/.test(o.name)) {
        const v = new THREE.Vector3();
        o.getWorldPosition(v);
        bonePts.push(v);
      }
    });
    let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity,
        minZ = Infinity, maxZ = -Infinity;
    for (const p of bonePts) {
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
    }
    const rawH = maxY - minY;
    const s = rawH > 0 ? 1.0 / rawH : 1;
    model.scale.setScalar(s);
    model.position.set(-((minX + maxX) / 2) * s, -minY * s, -((minZ + maxZ) / 2) * s);
    scene.updateMatrixWorld(true);
    model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });

    // GLTFLoader strips dots from node names ('Ear1.L' loads as 'Ear1L').
    const bone = (name) => model.getObjectByName(name) ||
                            model.getObjectByName(name.replace(/\./g, '')) || null;
    for (const n of ['Head', 'Neck3', 'Neck1', 'Ear1.L', 'Ear1.R', 'Tail1', 'Tail2', 'Torso'])
      B[n] = bone(n);
    WDIAG.bones = Object.keys(B).filter((k) => B[k]);
    if (!B.Head) { worldFail('rig', 'no Head bone in model'); return; }

    mixer = new THREE.AnimationMixer(model);
    const findClip = (name) => THREE.AnimationClip.findByName(gltf.animations, name);
    const mk = (name, loop) => {
      const c = findClip(name);
      if (!c) return null;
      const a = mixer.clipAction(c);
      a.loop = loop ? THREE.LoopRepeat : THREE.LoopOnce;
      a.clampWhenFinished = !loop;
      return a;
    };
    ACT.idle = mk('Idle', true);
    ACT.idle2 = mk('Idle_2', true);
    ACT.headlow = mk('Idle_2_HeadLow', true);
    ACT.jump = mk('Jump_ToIdle', false);
    WDIAG.clips = gltf.animations.map((a) => a.name);
    if (!ACT.idle) { worldFail('rig', 'no Idle clip in model'); return; }
    ACT.idle.play();
    curAction = ACT.idle;
    function crossTo(a, dur) {
      if (!a || a === curAction) return;
      const prev = curAction;
      a.enabled = true;
      a.reset();
      a.setEffectiveWeight(1);
      a.fadeIn(dur || 0.45);
      a.play();
      if (prev) prev.fadeOut(dur || 0.45);
      curAction = a;
    }

    // Camera: frame the dog from the head side, gentle three-quarter.
    const hv = new THREE.Vector3(), tv = new THREE.Vector3();
    B.Head.getWorldPosition(hv);
    if (B.Tail1) B.Tail1.getWorldPosition(tv); else tv.set(hv.x, hv.y, hv.z - 0.5);
    const fwd = hv.clone().sub(tv); fwd.y = 0;
    if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, 1);
    fwd.normalize();
    const side = new THREE.Vector3(-fwd.z, 0, fwd.x);
    camera.position.copy(hv)
      .addScaledVector(fwd, 1.5).addScaledVector(side, 0.52);
    camera.position.y = hv.y + 0.14;
    camera.lookAt(hv.x - fwd.x * 0.34, hv.y - 0.30, hv.z - fwd.z * 0.34);
    // Warm back wall behind the dog, facing the camera.
    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 9),
      new THREE.MeshStandardMaterial({ color: 0x4a3423, roughness: 1 }));
    wall.position.copy(fwd.clone().multiplyScalar(-3.6));
    wall.position.y = 2.2;
    wall.lookAt(0, 1.4, 0);
    scene.add(wall);

    window.worldSetState = (name) => {
      try {
        cur = name;
        W.idle2Until = 0;
        if (name === 'make') {
          if (ACT.jump) {
            crossTo(ACT.jump, 0.12);
            W.jumpUntil = performance.now() + ACT.jump.getClip().duration * 1000;
          }
          W.perkVel += 2.6;
        } else if (name === 'work') {
          crossTo(ACT.headlow || ACT.idle2 || ACT.idle, 0.5);
        } else {
          crossTo(ACT.idle, 0.4);
        }
      } catch (e) { /* state flips must never throw into the stage */ }
    };
    window.__lashWorld = {
      on: () => WORLD.on, jaw: () => W.jaw, state: () => cur, diag: WDIAG,
      tune: WTUNE,
      headRot: () => B.Head ? [B.Head.rotation.x, B.Head.rotation.y, B.Head.rotation.z] : null,
      cam: () => camera.position.toArray(),
    };

    const clock = new THREE.Clock();
    const spring = (x, v, target, stiff, damp, dt) => {
      v += ((target - x) * stiff - v * damp) * dt;
      x += v * dt;
      return [x, v];
    };
    function tick() {
      if (!WORLD.on) return;
      if (document.hidden) return;
      try {
        WDIAG.frames += 1;
        const dt = Math.min(0.05, clock.getDelta());
        const ts = performance.now(), t = ts / 1000;
        // Speech envelope -> jaw: identical math to the v6 puppet jaw.
        let amp = 0;
        if (PUP.speech) {
          const sp = PUP.speech;
          const ct = (sp.mode === 'audio' && currentAudio)
            ? currentAudio.currentTime : (ts - sp.t0) / 1000;
          const idx = Math.floor(ct / 0.06);
          if (idx >= 0 && idx < sp.env.length) amp = sp.env[idx];
        }
        W.jaw += (amp - W.jaw) * (amp > W.jaw ? 0.55 : 0.30);
        if (W.jaw < 0.003 && !PUP.speech) W.jaw = 0;
        if (PUP.speech && !W.prevSpeech) W.perkVel += 2.2;   // line start: ears up
        W.prevSpeech = PUP.speech;
        const perkT = PUP.speech ? 0.8 : (cur === 'make' ? 1.0 : (cur === 'work' ? 0.35 : 0.12));
        [W.perk, W.perkVel] = spring(W.perk, W.perkVel, perkT, 110, 13, dt);
        [W.tilt, W.tiltVel] = spring(W.tilt, W.tiltVel, cur === 'work' ? WTUNE.tiltRad : 0, 46, 10, dt);
        [W.look, W.lookVel] = spring(W.look, W.lookVel, cur === 'work' ? WTUNE.lookDown : 0, 46, 10, dt);
        if (ACT.jump && curAction === ACT.jump && ts > W.jumpUntil && W.jumpUntil)
          crossTo(ACT.idle, 0.35);
        // Idle variety: an occasional Idle_2 visit while just listening.
        if (cur === 'idle' && !PUP.speech && ACT.idle2) {
          if (!W.idle2Until && ts > W.nextIdle2) { crossTo(ACT.idle2, 0.6); W.idle2Until = ts + 3600; }
          else if (W.idle2Until && ts > W.idle2Until) {
            W.idle2Until = 0; W.nextIdle2 = ts + 9000 + Math.random() * 6000;
            crossTo(ACT.idle, 0.6);
          }
        }
        // Procedural layer: deltas added on top of the clip pose. Every
        // delta is UNDONE before the next mixer.update — a channel the
        // clip doesn't animate would otherwise accumulate our deltas
        // frame over frame (that bug stretched the neck in testing).
        for (const [obj, key2, val] of W.applied) obj[key2] -= val;
        W.applied.length = 0;
        mixer.update(dt);
        const add = (obj, key2, val) => { obj[key2] += val; W.applied.push([obj, key2, val]); };
        const jaw = W.jaw;
        if (B.Head) {
          add(B.Head.rotation, 'x', WTUNE.pitchSign * (jaw * WTUNE.jawDip + W.look));
          add(B.Head.rotation, 'z', WTUNE.tiltSign * W.tilt);
          add(B.Head.position, 'y', -jaw * WTUNE.jawDrop);
        }
        if (B.Neck3) add(B.Neck3.rotation, 'x', WTUNE.pitchSign * jaw * WTUNE.neckDip);
        if (B.Neck1) add(B.Neck1.rotation, 'x', WTUNE.pitchSign * W.look * 0.4);
        if (B.Torso) add(B.Torso.rotation, 'x', Math.sin(t * (2 * Math.PI / 3.6)) * 0.012);
        // Ears: perk splay + the blink-equivalent (a quick single-ear flick).
        let flick = 0;
        if (W.flickT0 < 0 && ts > W.flickAt) { W.flickT0 = ts; W.flickEar = Math.random() < 0.5 ? 'L' : 'R'; }
        if (W.flickT0 >= 0) {
          const p = (ts - W.flickT0) / 240;
          if (p >= 1) { W.flickT0 = -1; W.flickAt = ts + 2400 + Math.random() * 3200; }
          else flick = Math.sin(p * Math.PI);
        }
        const earSwing = Math.sin(t * 0.9) * 0.03 * (1 - W.perk * 0.5);
        if (B['Ear1.L']) {
          add(B['Ear1.L'].rotation, 'z', WTUNE.earSplay * W.perk + earSwing +
            (W.flickEar === 'L' ? flick * 0.35 : 0));
          add(B['Ear1.L'].rotation, 'x', -WTUNE.earBack * W.perk);
        }
        if (B['Ear1.R']) {
          add(B['Ear1.R'].rotation, 'z', -WTUNE.earSplay * W.perk - earSwing -
            (W.flickEar === 'R' ? flick * 0.35 : 0));
          add(B['Ear1.R'].rotation, 'x', -WTUNE.earBack * W.perk);
        }
        // Tail wag: faster and wider when greeting or talking.
        const wagSpeed = cur === 'make' ? 10 : (PUP.speech ? 6.5 : 2.4);
        const wagAmp = cur === 'make' ? 0.5 : (PUP.speech ? 0.36 : 0.16);
        W.wagPhase += dt * wagSpeed;
        if (B.Tail1) add(B.Tail1.rotation, 'y', Math.sin(W.wagPhase) * wagAmp);
        if (B.Tail2) add(B.Tail2.rotation, 'y', Math.sin(W.wagPhase - 0.7) * wagAmp * 0.7);
        renderer.render(scene, camera);
        W.errStreak = 0;
      } catch (e) {
        W.errStreak += 1;
        WDIAG.err = String((e && e.message) || e);
        if (W.errStreak > 5) worldDisable();
      }
    }
    worldEnable();
    renderer.setAnimationLoop(tick);
  } catch (e) { worldFail('build', e); }
})();
</script>
</body>
</html>
