<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lash</title>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
  html, body { margin:0; height:100%; background:#101418; color:#e8eef2;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; box-sizing:border-box; }
  #face { width:220px; height:220px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3d4b57, #1b232b);
    display:flex; align-items:center; justify-content:center;
    font-size:110px; border:4px solid #2c3944; transition: box-shadow .25s; }
  #face.speaking { box-shadow: 0 0 0 10px rgba(90,180,255,.25), 0 0 60px rgba(90,180,255,.35); }
  #face.listening { box-shadow: 0 0 0 8px rgba(120,255,170,.18); }
  #name { font-size:28px; font-weight:600; letter-spacing:.02em; }
  #status { font-size:15px; color:#9fb2c1; min-height:20px; }
  #caption { max-width:900px; text-align:center; font-size:20px; line-height:1.45;
    color:#d7e3ec; min-height:56px; }
  #heard { max-width:900px; text-align:center; font-size:16px; color:#7f95a7;
    min-height:22px; font-style: italic; }
</style>
</head>
<body>
<div id="wrap">
  <div id="face">🐶</div>
  <div id="name">Lash</div>
  <div id="status">connecting…</div>
  <div id="caption"></div>
  <div id="heard"></div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const token = qs.get('t') || '';
const face = document.getElementById('face');
const statusEl = document.getElementById('status');
const captionEl = document.getElementById('caption');
const heardEl = document.getElementById('heard');

const queue = [];
let playing = false;
let currentAudio = null;
let currentText = '';

function setStatus(s) { statusEl.textContent = s; }

// ---- transport selection ----
// GitHub-mailbox mode (?gh=<owner/repo>&pat=<token>&session=<id>): production.
// Two append-only streams in one private repo, one writer each:
//   sessions/<id>/u/*  Howard's lines   (this page writes, the bridge reads)
//   sessions/<id>/s/*  Lash's lines     (the bridge writes, this page reads)
//   sessions/<id>/a/*  rendered speech audio for the s/ entries
//   sessions/<id>/c/*  control notes (barge-in, session end)
// Relay-WS mode is the local-test transport.
const GH = qs.get('gh');
const PAT = qs.get('pat');
const SESSION = qs.get('session') || 'dev-session';
const BRANCH = qs.get('branch') || 'main';
const ghMode = !!(GH && PAT);
const GH_API = `https://api.github.com/repos/${GH}`;
const SESS = `sessions/${SESSION}`;

// ---- live-wire mode (?live=<ably key>): Phase 2 production transport ----
// Ably channels lash-<session>-up (this page publishes utterances/control)
// and lash-<session>-down (speech lines + binary audio frames). GitHub
// stays as the archive, written by the bridge — not the road.
const LIVE_KEY = qs.get('live');
const liveMode = !!LIVE_KEY;
let upCh = null, downCh = null;
const pendingLines = new Map();
const pendingAudio = new Map();
function pairSpeech(seq) {
  const line = pendingLines.get(seq);
  const url = pendingAudio.get(seq);
  if (!line || !url) return;
  pendingLines.delete(seq);
  pendingAudio.delete(seq);
  queue.push({seq, text: line.text, audio_url: url});
  playNext();
}
if (liveMode && window.Ably) {
  try {
    const ably = new Ably.Realtime({key: LIVE_KEY, clientId: 'stage'});
    upCh = ably.channels.get(`lash-${SESSION}-up`);
    downCh = ably.channels.get(`lash-${SESSION}-down`);
    ably.connection.on('connected', () => {
      setStatus('listening (live)');
      face.className = 'listening';
      publishHello();
    });
    ably.connection.on('failed', () => setStatus('live wire failed'));
    downCh.subscribe('line', (m) => {
      pendingLines.set(m.data.seq, m.data);
      setTimeout(() => pendingLines.delete(m.data.seq), 8000);
      pairSpeech(m.data.seq);
    });
    downCh.subscribe('audio', (m) => {
      try {
        const buf = m.data;
        const seq = new DataView(buf).getUint32(0);
        const blob = new Blob([buf.slice(4)], {type: 'audio/mpeg'});
        pendingAudio.set(seq, URL.createObjectURL(blob));
        setTimeout(() => pendingAudio.delete(seq), 8000);
        pairSpeech(seq);
      } catch (e) { /* bad frame — skip */ }
    });
    downCh.subscribe('flush', () => stopPlayback());
    downCh.subscribe('say_text', (m) => {
      queue.push({seq: m.data.seq, kind: 'text', text: m.data.text,
                  voiceName: m.data.voiceName || null,
                  rate: m.data.rate || 1.0, pitch: m.data.pitch ?? 1.0});
      playNext();
    });
  } catch (e) { setStatus('live wire error'); }
}

// ---- capability handshake ----
// Announce this browser's speech-synthesis inventory up the wire so the
// bridge can negotiate a voice profile and use the text lane (speak here)
// instead of shipping rendered audio. Republish as voices load.
let helloCount = 0;
let lastVoiceSig = '';
function publishHello() {
  if (!upCh || helloCount >= 4) return;
  let voices = [];
  try {
    voices = (window.speechSynthesis ? speechSynthesis.getVoices() : [])
      .map(v => ({name: v.name, lang: v.lang,
                  localService: !!v.localService, isDefault: !!v.default}));
  } catch (e) { /* no synthesis in this browser */ }
  const sig = voices.map(v => v.name).join('|');
  if (sig === lastVoiceSig && helloCount > 0) return;
  lastVoiceSig = sig;
  helloCount += 1;
  upCh.publish('hello', {voices, ua: navigator.userAgent, ts: Date.now()});
}
try {
  if (window.speechSynthesis)
    speechSynthesis.onvoiceschanged = () => publishHello();
} catch (e) { /* ignore */ }

// ---- relay websocket (local-test transport) ----
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const relay = ghMode
  ? { readyState: 0, send: () => {} }
  : new WebSocket(`${proto}//${location.host}/stage-ws?t=${token}`);
if (!ghMode) {
relay.onopen = () => setStatus('listening');
relay.onclose = () => setStatus('relay disconnected');
relay.onmessage = (ev) => {
  let m; try { m = JSON.parse(ev.data); } catch { return; }
  if (m.type === 'say') {
    queue.push(m);
    playNext();
  } else if (m.type === 'flush') {
    stopPlayback();
  } else if (m.type === 'heard') {
    heardEl.textContent = m.speaker + ': ' + m.text;
  } else if (m.type === 'session_end') {
    stopPlayback();
    setStatus('session ended');
  }
};
} // end if (!ghMode)

// ---- playback ----
async function playNext() {
  if (playing || queue.length === 0) return;
  const item = queue.shift();
  playing = true;
  currentText = item.text;
  captionEl.textContent = item.text;
  face.className = 'speaking';
  setStatus('speaking');
  if (item.kind === 'text') {
    // Text lane: this browser speaks. Negotiated voice, MP3 fallback is
    // the bridge's job (triggered by the synth_error report below).
    try {
      const voices = speechSynthesis.getVoices();
      const v = voices.find(x => x.name === item.voiceName)
             || voices.find(x => x.lang && x.lang.startsWith('en'))
             || voices[0];
      if (!v) throw new Error('no voices');
      const u = new SpeechSynthesisUtterance(item.text);
      u.voice = v;
      u.rate = item.rate || 1.0;
      u.pitch = item.pitch ?? 1.0;
      u.onend = () => {
        if (upCh) upCh.publish('control',
          {type: 'speech_done', seq: item.seq, ok: true});
        donePlaying(item);
      };
      u.onerror = (ev) => {
        if (upCh) upCh.publish('control',
          {type: 'synth_error', seq: item.seq, error: String(ev.error || 'synth')});
        donePlaying(item);
      };
      speechSynthesis.speak(u);
    } catch (e) {
      if (upCh) upCh.publish('control',
        {type: 'synth_error', seq: item.seq, error: String(e && e.message || e)});
      donePlaying(item);
    }
    return;
  }
  try {
    let url = item.audio_url;
    if (item.gh_audio_path) url = await ghRawObjectURL(item.gh_audio_path);
    currentAudio = new Audio(url);
    currentAudio.onended = () => donePlaying(item);
    currentAudio.onerror = () => donePlaying(item);
    await currentAudio.play();
  } catch (e) { donePlaying(item); }
}
function donePlaying(item) {
  playing = false;
  currentAudio = null;
  face.className = 'listening';
  setStatus('listening');
  if (relay.readyState === 1) relay.send(JSON.stringify({type:'playback_done', seq:item.seq}));
  playNext();
}
function stopPlayback() {
  queue.length = 0;
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch {}
  if (currentAudio) { try { currentAudio.pause(); } catch {} currentAudio = null; }
  playing = false;
  face.className = 'listening';
  setStatus('listening');
}

// ---- Recall in-page transcript stream (only works inside the bot) ----
// Final utterances go to the u/ stream; speech while Lash is talking is a
// barge-in: stop locally at once and drop a control note in c/.
let lastBargeAt = 0;
try {
  const rt = new WebSocket('wss://meeting-data.bot.recall.ai/api/v1/transcript');
  let lastSent = '';
  rt.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    const tr = m.transcript || m.data?.transcript || {};
    const words = tr.words || [];
    const text = words.map(w => w.text).join(' ').trim();
    if (!text) return;
    if (playing) {
      stopPlayback();
      const now = Date.now();
      if (now - lastBargeAt > 2000) {
        lastBargeAt = now;
        if (liveMode && upCh)
          upCh.publish('control', {type:'speaking_started',
                                   detail: currentText, ts: now});
        else if (ghMode) ghPutJSON(`${SESS}/c/${now}-barge.json`,
                              {type:'speaking_started', detail: currentText, ts: now});
        else if (relay.readyState === 1)
          relay.send(JSON.stringify({type:'speaking_started', during_text: currentText}));
      }
    }
    const isFinal = tr.is_final !== false;
    if (isFinal && text !== lastSent) {
      lastSent = text;
      heardEl.textContent = 'Howard: ' + text;
      if (liveMode && upCh) {
        upCh.publish('utterance', {speaker: 'Howard', text, ts: Date.now()});
      } else if (ghMode) {
        ghPutJSON(`${SESS}/u/${Date.now()}-${Math.random().toString(36).slice(2,8)}.json`,
                  {speaker: 'Howard', text, ts: Date.now()});
      } else if (relay.readyState === 1) {
        relay.send(JSON.stringify({type:'transcript_final', speaker:'Howard', text}));
      }
    }
  };
} catch (e) { /* not inside a Recall bot — local tests drive the WS mode */ }

// ---- GitHub mailbox ----
function ghHeaders(extra) {
  return Object.assign({Authorization: `Bearer ${PAT}`,
                        Accept: 'application/vnd.github+json'}, extra || {});
}
function b64utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64bytes(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function ghPut(path, base64Content, message) {
  try {
    await fetch(`${GH_API}/contents/${path}`, {
      method: 'PUT', headers: ghHeaders({'Content-Type': 'application/json'}),
      body: JSON.stringify({message, content: base64Content, branch: BRANCH}),
    });
  } catch (e) { /* transient; the conversation carries on */ }
}
function ghPutJSON(path, obj) {
  return ghPut(path, b64utf8(JSON.stringify(obj)), `mailbox ${path}`);
}
async function ghRaw(path) {
  const r = await fetch(`${GH_API}/contents/${path}?ref=${BRANCH}`, {
    headers: ghHeaders({Accept: 'application/vnd.github.raw+json'})});
  if (!r.ok) throw new Error('gh raw ' + r.status);
  return r;
}
async function ghRawObjectURL(path) {
  const r = await ghRaw(path);
  const blob = await r.blob();
  return URL.createObjectURL(blob);
}

if (ghMode && !liveMode) {
  setStatus('listening');
  face.className = 'listening';
  let etag = null;
  const seenSpeeches = new Set();
  setInterval(async () => {
    try {
      const headers = ghHeaders();
      if (etag) headers['If-None-Match'] = etag;
      const r = await fetch(`${GH_API}/git/trees/${BRANCH}?recursive=1`, {headers});
      if (r.status === 304) return;
      if (!r.ok) return;
      etag = r.headers.get('ETag');
      const data = await r.json();
      const prefix = `${SESS}/s/`;
      const entries = (data.tree || [])
        .filter(e => e.type === 'blob' && e.path.startsWith(prefix) && e.path.endsWith('.json'))
        .sort((a, b) => a.path < b.path ? -1 : 1);
      for (const e of entries) {
        if (seenSpeeches.has(e.path)) continue;
        seenSpeeches.add(e.path);
        try {
          const resp = await ghRaw(e.path);
          const row = await resp.json();
          queue.push({seq: row.seq, kind: row.kind, text: row.text,
                      gh_audio_path: row.audio || null});
        } catch (err) { /* skip a bad entry */ }
      }
      if (entries.length) playNext();
    } catch (e) { /* poll again next tick */ }
  }, 1000);
}
</script>
</body>
</html>
