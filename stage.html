<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lash</title>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
  html, body { margin:0; height:100%; background:#101418; color:#e8eef2;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; box-sizing:border-box; }
  #face { width:220px; height:220px; border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:110px; border:4px solid #2c3944; transition: box-shadow .25s;
    overflow:hidden; }
  #face video { width:100%; height:100%; object-fit:cover; display:block; }
  #face canvas { width:100%; height:100%; display:block; }
  #face.speaking { box-shadow: 0 0 0 10px rgba(90,180,255,.25), 0 0 60px rgba(90,180,255,.35);
    animation: talkbob .9s ease-in-out infinite; }
  @keyframes talkbob { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  #face.listening { box-shadow: 0 0 0 8px rgba(120,255,170,.18); }
  #name { font-size:28px; font-weight:600; letter-spacing:.02em; }
  #status { font-size:15px; color:#9fb2c1; min-height:20px; }
  #caption { max-width:900px; text-align:center; font-size:20px; line-height:1.45;
    color:#d7e3ec; min-height:56px; }
  #heard { max-width:900px; text-align:center; font-size:16px; color:#7f95a7;
    min-height:22px; font-style: italic; }
</style>
</head>
<body>
<div id="wrap">
  <div id="face"><canvas id="puppetCanvas" width="900" height="900" style="display:none"></canvas><video id="faceVideo" src="lash-face.mp4" poster="lash-face.jpg" autoplay muted loop playsinline></video><video id="faceTalk" src="lash-talk.mp4" muted loop playsinline preload="auto" style="display:none"></video><video id="faceWork" src="lash-work.mp4" muted loop playsinline preload="auto" style="display:none"></video><video id="faceMake" src="lash-make.mp4" muted loop playsinline preload="auto" style="display:none"></video></div>
  <div id="name">Lash</div>
  <div id="status">connecting…</div>
  <div id="caption"></div>
  <div id="heard"></div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const token = qs.get('t') || '';
const face = document.getElementById('face');
const statusEl = document.getElementById('status');
const captionEl = document.getElementById('caption');
const heardEl = document.getElementById('heard');

const queue = [];
let playing = false;
let currentAudio = null;
let currentText = '';

// Puppet state (stage v6) — declared early; the engine lives below the
// face-state code. PUP.on stays false until every mandatory layer has
// loaded, and every puppet failure path leaves the v5 medallion alone.
const PUP = {
  on: false, imgs: {}, speech: null, ctx: null,
  jaw: 0, perk: 0, perkVel: 0, tilt: 0, tiltVel: 0,
  blinkAt: 2600, blinkT0: -1, bounceT0: -1, lastTs: 0,
};

function setStatus(s) { statusEl.textContent = s; }

// Face media fallback: if the video can't load (e.g. local relay serving),
// fall back to the emoji so the stage never shows a broken medallion.
try {
  const fv = document.getElementById('faceVideo');
  fv.addEventListener('error', () => { if (!PUP.on) face.textContent = '🐶'; }, true);
  const p = fv.play && fv.play();
  if (p && p.catch) p.catch(() => {});
} catch (e) { /* the poster/emoji world still works */ }

// ---- transport selection ----
// GitHub-mailbox mode (?gh=<owner/repo>&pat=<token>&session=<id>): production.
// Two append-only streams in one private repo, one writer each:
//   sessions/<id>/u/*  Howard's lines   (this page writes, the bridge reads)
//   sessions/<id>/s/*  Lash's lines     (the bridge writes, this page reads)
//   sessions/<id>/a/*  rendered speech audio for the s/ entries
//   sessions/<id>/c/*  control notes (barge-in, session end)
// Relay-WS mode is the local-test transport.
const GH = qs.get('gh');
const PAT = qs.get('pat');
const SESSION = qs.get('session') || 'dev-session';
const BRANCH = qs.get('branch') || 'main';
const ghMode = !!(GH && PAT);
const GH_API = `https://api.github.com/repos/${GH}`;
const SESS = `sessions/${SESSION}`;

// ---- live-wire mode (?live=<ably key>): Phase 2 production transport ----
// Ably channels lash-<session>-up (this page publishes utterances/control)
// and lash-<session>-down (speech lines + binary audio frames). GitHub
// stays as the archive, written by the bridge — not the road.
const LIVE_KEY = qs.get('live');
const liveMode = !!LIVE_KEY;
let upCh = null, downCh = null;
const pendingLines = new Map();
const pendingAudio = new Map();
function pairSpeech(seq) {
  const line = pendingLines.get(seq);
  const url = pendingAudio.get(seq);
  if (!line || !url) return;
  pendingLines.delete(seq);
  pendingAudio.delete(seq);
  queue.push({seq, text: line.text, audio_url: url, env: line.env || null});
  playNext();
}
if (liveMode && window.Ably) {
  try {
    const ably = new Ably.Realtime({key: LIVE_KEY, clientId: 'stage'});
    upCh = ably.channels.get(`lash-${SESSION}-up`);
    downCh = ably.channels.get(`lash-${SESSION}-down`);
    ably.connection.on('connected', () => {
      setStatus('listening (live)');
      face.className = 'listening';
      publishHello();
      // Greeting: the playful standing portrait for the first seconds.
      faceShow('make');
      setTimeout(() => { if (faceState === 'make' && !playing) faceShow('idle'); }, 8000);
    });
    ably.connection.on('failed', () => setStatus('live wire failed'));
    downCh.subscribe('line', (m) => {
      pendingLines.set(m.data.seq, m.data);
      setTimeout(() => pendingLines.delete(m.data.seq), 8000);
      pairSpeech(m.data.seq);
    });
    downCh.subscribe('audio', (m) => {
      try {
        const buf = m.data;
        const seq = new DataView(buf).getUint32(0);
        const blob = new Blob([buf.slice(4)], {type: 'audio/mpeg'});
        pendingAudio.set(seq, URL.createObjectURL(blob));
        setTimeout(() => pendingAudio.delete(seq), 8000);
        pairSpeech(seq);
      } catch (e) { /* bad frame — skip */ }
    });
    downCh.subscribe('flush', () => stopPlayback());
    downCh.subscribe('say_text', (m) => {
      queue.push({seq: m.data.seq, kind: 'text', text: m.data.text,
                  voiceName: m.data.voiceName || null,
                  rate: m.data.rate || 1.0, pitch: m.data.pitch ?? 1.0});
      playNext();
    });
    // Face-state signals from the bridge (e.g. thinking while a reply is
    // being composed). Never fight active speech; auto-revert to idle.
    let thinkTimer = null;
    downCh.subscribe('face', (m) => {
      if (!m.data || playing) return;
      if (m.data.state === 'thinking') {
        faceShow('work');
        clearTimeout(thinkTimer);
        thinkTimer = setTimeout(() => { if (!playing) faceShow('idle'); }, 25000);
      }
    });
  } catch (e) { setStatus('live wire error'); }
}

// ---- capability handshake ----
// Announce this browser's speech-synthesis inventory up the wire so the
// bridge can negotiate a voice profile and use the text lane (speak here)
// instead of shipping rendered audio. Republish as voices load.
let helloCount = 0;
let lastVoiceSig = '';
function publishHello() {
  if (!upCh || helloCount >= 4) return;
  let voices = [];
  try {
    voices = (window.speechSynthesis ? speechSynthesis.getVoices() : [])
      .map(v => ({name: v.name, lang: v.lang,
                  localService: !!v.localService, isDefault: !!v.default}));
  } catch (e) { /* no synthesis in this browser */ }
  const sig = voices.map(v => v.name).join('|');
  if (sig === lastVoiceSig && helloCount > 0) return;
  lastVoiceSig = sig;
  helloCount += 1;
  upCh.publish('hello', {voices, ua: navigator.userAgent, ts: Date.now()});
}
try {
  if (window.speechSynthesis)
    speechSynthesis.onvoiceschanged = () => publishHello();
} catch (e) { /* ignore */ }

// ---- relay websocket (local-test transport) ----
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const relay = (ghMode || liveMode)
  ? { readyState: 0, send: () => {} }
  : new WebSocket(`${proto}//${location.host}/stage-ws?t=${token}`);
if (!ghMode && !liveMode) {
relay.onopen = () => setStatus('listening');
relay.onclose = () => setStatus('relay disconnected');
relay.onmessage = (ev) => {
  let m; try { m = JSON.parse(ev.data); } catch { return; }
  if (m.type === 'say') {
    queue.push(m);
    playNext();
  } else if (m.type === 'flush') {
    stopPlayback();
  } else if (m.type === 'heard') {
    heardEl.textContent = m.speaker + ': ' + m.text;
  } else if (m.type === 'session_end') {
    stopPlayback();
    setStatus('session ended');
  }
};
} // end if (!ghMode)

// Face animation system: the medallion carries Lash's full set of
// animated portraits and swaps by state —
//   idle  = seated portrait (listening)
//   talk  = close-up portrait (speaking)
//   work  = headphones at the laptop (thinking / composing a reply)
//   make  = standing, playful (greeting on arrival)
const FACE_VIDS = { idle: 'faceVideo', talk: 'faceTalk', work: 'faceWork', make: 'faceMake' };
let faceState = 'idle';
function faceShow(name) {
  try {
    if (!FACE_VIDS[name]) name = 'idle';
    faceState = name;
    if (PUP.on) { puppetSetState(name); return; }
    for (const [k, id] of Object.entries(FACE_VIDS)) {
      const el = document.getElementById(id);
      if (!el) continue;
      if (k === name) { el.style.display = 'block'; const p = el.play(); if (p && p.catch) p.catch(() => {}); }
      else { el.style.display = 'none'; try { el.pause(); } catch (e) {} }
    }
  } catch (e) { /* medallion keeps whatever portrait it has */ }
}
function faceTalk(on) { faceShow(on ? 'talk' : 'idle'); }

// ---- puppet engine (stage v6) ----
// A hand-rolled 2D photo-puppet of Lash on a canvas inside the medallion:
// layered cutouts of his avatar still (base with ears painted out, ear
// layers, blink patches — see puppet/cut_layers.py) plus a strip-warp of
// the muzzle for the jaw. The jaw is NOT a cutout (its seams showed);
// instead, horizontal strips of the muzzle are re-drawn from the base
// image with a smooth downward displacement — beard strands are vertical
// and self-similar, so the stretch reads as the jaw opening.
//
// AMPLITUDE ROUTE (chosen): the bridge computes an exact RMS envelope
// per rendered line (60ms windows) and ships it with the line; the jaw
// tracks it against the audio element's clock. Zero browser audio-graph
// risk — no AudioContext anywhere near the call audio. Lines without an
// envelope (text lane, relay-WS and GitHub transports) get a synthesized
// envelope from the text: one decaying pulse per syllable.
//
// Geometry constants mirror puppet/manifest.json (frame = the 900x900
// crop at source (470,0) of the avatar still).
const PUP_EAR = {
  L: {dx: 140, dy: 35, px: 230, py: 335, img: 'earL', dir: -1},
  R: {dx: 505, dy: 25, px: 582, py: 232, img: 'earR', dir: 1},
};
const PUP_WARP = {x: 300, y: 540, w: 480, h: 205, peakY: 695,
                  mx: 588, my: 580, travel: 17, step: 9};
const PUP_PIVOT = [410, 830];
const PUP_BLINK = {L: [340, 322], R: [542, 309]};

function puppetSetState(name) {
  if (name === 'make') PUP.bounceT0 = performance.now();
}
function puppetTargetPerk() {
  if (PUP.speech) return 0.8;
  if (faceState === 'make') return 1.0;
  if (faceState === 'work') return 0.35;
  return 0;
}
function puppetTargetTilt() { return faceState === 'work' ? 3.0 : 0; }

function synthEnvelope(text, seconds) {
  const words = (text || '').split(/\s+/).filter(Boolean);
  const syl = [];
  for (const w of words) {
    const groups = (w.toLowerCase().match(/[aeiouy]+/g) || []).length;
    syl.push(Math.max(1, Math.min(4, groups || 1)));
  }
  const total = syl.reduce((a, b) => a + b, 0) || 1;
  const win = 0.06, n = Math.max(1, Math.ceil(seconds / win));
  const env = new Array(n).fill(0);
  let t = 0.02, seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (const s of syl) {
    const dt = seconds * (s / total);
    const peak = 0.45 + rnd() * 0.5;
    for (let k = 0; k < 3; k++) {
      const idx = Math.floor((t + k * win) / win);
      if (idx < n) env[idx] = Math.max(env[idx], peak * (1 - k * 0.3));
    }
    t += dt;
  }
  return env;
}

function puppetLineStart(item) {
  if (!PUP.on) return;
  try {
    let env = item.env;
    if (!env || !env.length) {
      const secs = Math.max(0.9, (item.text || '').length / 14);
      env = synthEnvelope(item.text, secs);
    }
    PUP.speech = {env, mode: item.kind === 'text' ? 'text' : 'audio',
                  t0: performance.now()};
    PUP.perkVel += 2.4;   // ears spring up as he starts talking
  } catch (e) { PUP.speech = null; }
}
function puppetLineEnd() { PUP.speech = null; }

function puppetEnable() {
  let cv = document.getElementById('puppetCanvas');
  if (!cv) {
    // The emoji fallback may have wiped #face before the layers loaded;
    // rebuild the canvas rather than giving up the puppet.
    face.textContent = '';
    cv = document.createElement('canvas');
    cv.id = 'puppetCanvas';
    cv.width = 900; cv.height = 900;
    face.appendChild(cv);
  }
  PUP.ctx = cv.getContext('2d');
  if (!PUP.ctx) return;
  PUP.on = true;
  for (const id of Object.values(FACE_VIDS)) {
    const el = document.getElementById(id);
    if (el) { el.style.display = 'none'; try { el.pause(); } catch (e) {} }
  }
  cv.style.display = 'block';
  puppetSetState(faceState);
  requestAnimationFrame(puppetFrame);
}
(function puppetLoad() {
  const files = {base: 'puppet-base.webp', earL: 'puppet-ear-l.webp',
                 earR: 'puppet-ear-r.webp', blinkL: 'puppet-blink-l.webp',
                 blinkR: 'puppet-blink-r.webp'};
  const need = ['base', 'earL', 'earR'];
  let ok = 0, dead = false;
  for (const [k, f] of Object.entries(files)) {
    const im = new Image();
    im.onload = () => {
      PUP.imgs[k] = im;
      if (need.includes(k) && ++ok === need.length && !dead) puppetEnable();
    };
    im.onerror = () => { if (need.includes(k)) dead = true; };
    im.src = f;
  }
})();

function pupProfile(y) {
  const W = PUP_WARP;
  if (y <= W.y) return 0;
  if (y <= W.peakY) { const t = (y - W.y) / (W.peakY - W.y); return t * t * (3 - 2 * t); }
  return Math.max(0.45, 1 - 0.55 * (y - W.peakY) / (W.y + W.h - W.peakY));
}

function puppetFrame(ts) {
  if (!PUP.on) return;
  requestAnimationFrame(puppetFrame);
  try {
    const ctx = PUP.ctx, t = ts / 1000;
    // amplitude from the active line's envelope
    let amp = 0;
    if (PUP.speech) {
      const s = PUP.speech;
      const ct = (s.mode === 'audio' && currentAudio)
        ? currentAudio.currentTime : (ts - s.t0) / 1000;
      const idx = Math.floor(ct / 0.06);
      if (idx >= 0 && idx < s.env.length) amp = s.env[idx];
      if (s.mode !== 'audio' && ct > s.env.length * 0.06 + 0.3) PUP.speech = null;
    }
    PUP.jaw += (amp - PUP.jaw) * (amp > PUP.jaw ? 0.55 : 0.30);
    if (PUP.jaw < 0.003 && !PUP.speech) PUP.jaw = 0;
    // springs: ear perk + thinking head-tilt
    const dt = Math.min(0.05, PUP.lastTs ? (ts - PUP.lastTs) / 1000 : 0.016);
    PUP.lastTs = ts;
    const spring = (x, v, target, stiff, damp) => {
      v += ((target - x) * stiff - v * damp) * dt;
      x += v * dt;
      return [x, v];
    };
    [PUP.perk, PUP.perkVel] = spring(PUP.perk, PUP.perkVel, puppetTargetPerk(), 110, 13);
    [PUP.tilt, PUP.tiltVel] = spring(PUP.tilt, PUP.tiltVel, puppetTargetTilt(), 46, 10);
    // blink scheduler
    let blink = 0;
    if (PUP.blinkT0 < 0 && ts > PUP.blinkAt) PUP.blinkT0 = ts;
    if (PUP.blinkT0 >= 0) {
      const p = (ts - PUP.blinkT0) / 170;
      if (p >= 1) { PUP.blinkT0 = -1; PUP.blinkAt = ts + 2400 + Math.random() * 3000; }
      else blink = Math.sin(p * Math.PI);
    }
    // compose
    const breathe = Math.sin(t * (2 * Math.PI / 3.6));
    let bounceY = 0;
    if (PUP.bounceT0 >= 0) {
      const p = (ts - PUP.bounceT0) / 900;
      if (p >= 1) PUP.bounceT0 = -1;
      else bounceY = -Math.sin(p * Math.PI) * 12;
    }
    const nod = Math.max(-1.1, Math.min(1.1, (PUP.jaw - 0.35) * 1.6));
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 900, 900);
    ctx.save();
    ctx.translate(PUP_PIVOT[0], PUP_PIVOT[1]);
    ctx.rotate((PUP.tilt + nod) * Math.PI / 180);
    ctx.scale(1, 1 + breathe * 0.005);
    ctx.translate(-PUP_PIVOT[0], -PUP_PIVOT[1]);
    ctx.translate(0, breathe * 1.4 + bounceY);
    const base = PUP.imgs.base;
    ctx.drawImage(base, 0, 0);
    if (PUP.jaw > 0.02) {
      const W = PUP_WARP;
      for (let y0 = W.y; y0 < W.y + W.h; y0 += W.step) {
        const off = pupProfile(y0 + W.step / 2) * W.travel * PUP.jaw;
        if (off < 0.2) continue;
        ctx.drawImage(base, W.x, y0, W.w, W.step + 3,
                      W.x, y0 + off, W.w, W.step + 3);
      }
      // soft mouth shadow that grows as the jaw opens
      const g = ctx.createRadialGradient(W.mx, W.my, 4, W.mx, W.my, 95);
      g.addColorStop(0, `rgba(26,18,12,${0.34 * PUP.jaw})`);
      g.addColorStop(1, 'rgba(26,18,12,0)');
      ctx.save();
      ctx.translate(W.mx, W.my);
      ctx.scale(1, (4 + 13 * PUP.jaw) / 95);
      ctx.translate(-W.mx, -W.my);
      ctx.fillStyle = g;
      ctx.fillRect(W.mx - 95, W.my - 95, 190, 190);
      ctx.restore();
    }
    for (const side of ['L', 'R']) {
      const E = PUP_EAR[side];
      const img = PUP.imgs[E.img];
      if (!img) continue;
      const sway = Math.sin(t * 0.9 + (side === 'L' ? 0 : 1.7)) * 0.7;
      const rot = E.dir * (PUP.perk * 4.6) + sway * (1 - PUP.perk * 0.5);
      ctx.save();
      ctx.translate(E.px, E.py);
      ctx.rotate(rot * Math.PI / 180);
      ctx.translate(-E.px, -E.py);
      ctx.drawImage(img, E.dx, E.dy);
      ctx.restore();
    }
    if (blink > 0.03) {
      ctx.globalAlpha = blink;
      if (PUP.imgs.blinkL) ctx.drawImage(PUP.imgs.blinkL, PUP_BLINK.L[0], PUP_BLINK.L[1]);
      if (PUP.imgs.blinkR) ctx.drawImage(PUP.imgs.blinkR, PUP_BLINK.R[0], PUP_BLINK.R[1]);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  } catch (e) { /* a bad frame must never kill the stage */ }
}
// Debug/test handle (local harness drives the puppet through this).
window.__lashPuppet = {
  pup: PUP,
  debugLine(env, secs) {
    PUP.speech = {env: env || synthEnvelope('debug line', secs || 3),
                  mode: 'text', t0: performance.now()};
  },
  state(name) { faceShow(name); },
};

// ---- playback ----
async function playNext() {
  if (playing || queue.length === 0) return;
  const item = queue.shift();
  playing = true;
  currentText = item.text;
  captionEl.textContent = item.text;
  face.className = 'speaking';
  faceTalk(true);
  setStatus('speaking');
  if (item.kind === 'text') {
    // Text lane: this browser speaks. Negotiated voice, MP3 fallback is
    // the bridge's job (triggered by the synth_error report below).
    try {
      const voices = speechSynthesis.getVoices();
      const v = voices.find(x => x.name === item.voiceName)
             || voices.find(x => x.lang && x.lang.startsWith('en'))
             || voices[0];
      if (!v) throw new Error('no voices');
      const u = new SpeechSynthesisUtterance(item.text);
      u.voice = v;
      u.rate = item.rate || 1.0;
      u.pitch = item.pitch ?? 1.0;
      u.onend = () => {
        if (upCh) upCh.publish('control',
          {type: 'speech_done', seq: item.seq, ok: true});
        donePlaying(item);
      };
      u.onerror = (ev) => {
        if (upCh) upCh.publish('control',
          {type: 'synth_error', seq: item.seq, error: String(ev.error || 'synth')});
        donePlaying(item);
      };
      speechSynthesis.speak(u);
      puppetLineStart(item);
    } catch (e) {
      if (upCh) upCh.publish('control',
        {type: 'synth_error', seq: item.seq, error: String(e && e.message || e)});
      donePlaying(item);
    }
    return;
  }
  try {
    let url = item.audio_url;
    if (item.gh_audio_path) url = await ghRawObjectURL(item.gh_audio_path);
    currentAudio = new Audio(url);
    currentAudio.onended = () => donePlaying(item);
    currentAudio.onerror = () => donePlaying(item);
    puppetLineStart(item);
    await currentAudio.play();
  } catch (e) { donePlaying(item); }
}
function donePlaying(item) {
  playing = false;
  currentAudio = null;
  puppetLineEnd();
  face.className = 'listening';
  faceTalk(false);
  setStatus('listening');
  if (relay.readyState === 1) relay.send(JSON.stringify({type:'playback_done', seq:item.seq}));
  playNext();
}
function stopPlayback() {
  queue.length = 0;
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch {}
  if (currentAudio) { try { currentAudio.pause(); } catch {} currentAudio = null; }
  playing = false;
  puppetLineEnd();
  face.className = 'listening';
  faceTalk(false);
  setStatus('listening');
}

// ---- Recall in-page transcript stream (only works inside the bot) ----
// Final utterances go to the u/ stream; speech while Lash is talking is a
// barge-in: stop locally at once and drop a control note in c/.
let lastBargeAt = 0;
try {
  const rt = new WebSocket('wss://meeting-data.bot.recall.ai/api/v1/transcript');
  let lastSent = '';
  rt.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    const tr = m.transcript || m.data?.transcript || {};
    const words = tr.words || [];
    const text = words.map(w => w.text).join(' ').trim();
    if (!text) return;
    if (playing) {
      stopPlayback();
      const now = Date.now();
      if (now - lastBargeAt > 2000) {
        lastBargeAt = now;
        if (liveMode && upCh)
          upCh.publish('control', {type:'speaking_started',
                                   detail: currentText, ts: now});
        else if (ghMode) ghPutJSON(`${SESS}/c/${now}-barge.json`,
                              {type:'speaking_started', detail: currentText, ts: now});
        else if (relay.readyState === 1)
          relay.send(JSON.stringify({type:'speaking_started', during_text: currentText}));
      }
    }
    const isFinal = tr.is_final !== false;
    if (isFinal && text !== lastSent) {
      lastSent = text;
      heardEl.textContent = 'Howard: ' + text;
      if (liveMode && upCh) {
        upCh.publish('utterance', {speaker: 'Howard', text, ts: Date.now()});
      } else if (ghMode) {
        ghPutJSON(`${SESS}/u/${Date.now()}-${Math.random().toString(36).slice(2,8)}.json`,
                  {speaker: 'Howard', text, ts: Date.now()});
      } else if (relay.readyState === 1) {
        relay.send(JSON.stringify({type:'transcript_final', speaker:'Howard', text}));
      }
    }
  };
} catch (e) { /* not inside a Recall bot — local tests drive the WS mode */ }

// ---- GitHub mailbox ----
function ghHeaders(extra) {
  return Object.assign({Authorization: `Bearer ${PAT}`,
                        Accept: 'application/vnd.github+json'}, extra || {});
}
function b64utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64bytes(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function ghPut(path, base64Content, message) {
  try {
    await fetch(`${GH_API}/contents/${path}`, {
      method: 'PUT', headers: ghHeaders({'Content-Type': 'application/json'}),
      body: JSON.stringify({message, content: base64Content, branch: BRANCH}),
    });
  } catch (e) { /* transient; the conversation carries on */ }
}
function ghPutJSON(path, obj) {
  return ghPut(path, b64utf8(JSON.stringify(obj)), `mailbox ${path}`);
}
async function ghRaw(path) {
  const r = await fetch(`${GH_API}/contents/${path}?ref=${BRANCH}`, {
    headers: ghHeaders({Accept: 'application/vnd.github.raw+json'})});
  if (!r.ok) throw new Error('gh raw ' + r.status);
  return r;
}
async function ghRawObjectURL(path) {
  const r = await ghRaw(path);
  const blob = await r.blob();
  return URL.createObjectURL(blob);
}

if (ghMode && !liveMode) {
  setStatus('listening');
  face.className = 'listening';
  let etag = null;
  const seenSpeeches = new Set();
  setInterval(async () => {
    try {
      const headers = ghHeaders();
      if (etag) headers['If-None-Match'] = etag;
      const r = await fetch(`${GH_API}/git/trees/${BRANCH}?recursive=1`, {headers});
      if (r.status === 304) return;
      if (!r.ok) return;
      etag = r.headers.get('ETag');
      const data = await r.json();
      const prefix = `${SESS}/s/`;
      const entries = (data.tree || [])
        .filter(e => e.type === 'blob' && e.path.startsWith(prefix) && e.path.endsWith('.json'))
        .sort((a, b) => a.path < b.path ? -1 : 1);
      for (const e of entries) {
        if (seenSpeeches.has(e.path)) continue;
        seenSpeeches.add(e.path);
        try {
          const resp = await ghRaw(e.path);
          const row = await resp.json();
          queue.push({seq: row.seq, kind: row.kind, text: row.text,
                      gh_audio_path: row.audio || null});
        } catch (err) { /* skip a bad entry */ }
      }
      if (entries.length) playNext();
    } catch (e) { /* poll again next tick */ }
  }, 1000);
}
