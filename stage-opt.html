<style>
  /* Stage revamp (2026-10-19, Howard): the full MI look — deep-navy
     scene, a large rounded-rectangle portrait card. Howard's world (v2,
     2026-10-19): Lash sits INSIDE a computer, at the helm of a
     command deck — circuit walls, waveform screens, console glow.
     Every face loop plays in that one room (deck plate), so a state
     change never changes the room; the thinking loop adds a thought
     cloud with cycling dots above his head (thinking state only), name + thinking pill under
     the card, and a near-opaque lower-third panel carrying status,
     caption and the heard line behind the product's cyan bracket.
     Skin only: no element IDs, no JS, no wiring changed. */
  html, body { margin:0; height:100%; color:#e8eef2;
    background:
      linear-gradient(180deg, rgba(5,15,28,.80) 0%, rgba(5,15,28,.88) 55%, rgba(4,12,22,.95) 100%),
      url('stage-deck-backdrop.jpg') center 30% / cover no-repeat,
      radial-gradient(1200px 700px at 50% -10%, #0d2c47 0%, #081c30 45%, #050f1c 100%)
      #050f1c;
    font-family: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; padding:22px; box-sizing:border-box; }
  #face { width:min(432px, 60vh, 88vw); aspect-ratio:1/1; border-radius:34px;
    background:#0a2438;
    display:flex; align-items:center; justify-content:center;
    font-size:110px; border:3px solid rgba(103,230,245,.55);
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 6px rgba(23,182,201,.10),
      0 0 44px rgba(23,182,201,.14);
    transition: box-shadow .25s;
    overflow:hidden; }
  #face video { width:100%; height:100%; object-fit:cover; display:block; }
  #face canvas { width:100%; height:100%; display:block; }
  /* Thinking halo (revamp): while the think pill is up, the portrait
     card breathes a slow, low teal glow. Pure CSS off the pill's own
     state (:has) — additive only: if it never fires, the pill still
     carries the signal exactly as before. */
  #wrap:has(#think.on) #face { animation: thinkHalo 4.6s ease-in-out infinite;
    filter: brightness(.965) saturate(1.03); }
  @keyframes thinkHalo {
    0%,100% { box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 6px rgba(25,211,197,.14), 0 0 40px rgba(25,211,197,.16); }
    50%     { box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 9px rgba(25,211,197,.26), 0 0 64px rgba(25,211,197,.30); } }
  /* Loops readability (stage v9.2, Fix Round 2): in loops mode the
     four state clips STACK and crossfade (opacity) instead of
     hard-cutting. Gated on the data attribute — set only in loops
     mode — so puppet/world paths, which share these elements and
     the #face className, keep their original rendering untouched. */
  #face[data-loops="1"] { position:relative; }
  #face[data-loops="1"] video { position:absolute; inset:0; opacity:0;
    transition: opacity .2s ease-in-out; }
  #face.speaking { box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 10px rgba(23,182,201,.28), 0 0 68px rgba(23,182,201,.38);
    animation: talkbob .9s ease-in-out infinite; }
  /* Muted presentation (2026-10-18): while the bridge holds Lash
     muted, the avatar stays on its idle loop, desaturated and
     dimmed, badged — muted must read at a glance as a deliberate
     state, never as a frozen or broken face. */
  #face.muted { position:relative; }
  #face.muted video, #face.muted canvas { filter: grayscale(.45) brightness(.72); }
  #mutedBadge { display:none; position:absolute; right:10px; bottom:10px;
    z-index:5; font-size:15px; line-height:1; background:rgba(0,0,0,.55);
    border-radius:999px; padding:4px 8px; }
  #face.muted #mutedBadge { display:block; }
  @keyframes talkbob { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  #face.listening { box-shadow: 0 0 0 8px rgba(120,255,170,.18); }
  #name { font-size:30px; font-weight:700; letter-spacing:.02em; }
  #name .name-brand { color:#19d3c5; }
  /* Moseley Innovations brand strip (skin only — no layout/JS changes) */
  #brand { display:flex; align-items:center; gap:10px; margin-top:2px; opacity:.85; }
  #brand img { width:28px; height:28px; border-radius:8px; border:1px solid rgba(23,182,201,.5); display:block; }
  #brand span { font-size:12px; font-weight:700; letter-spacing:.18em; color:#cfe6ee; }
  #brand em { font-style:normal; font-size:10.5px; font-weight:600; letter-spacing:.22em; color:#17b6c9; }
  /* Lower-third panel (revamp): status + caption + heard ride in one
     near-opaque navy panel — captions must survive Meet compression
     and a projector, so this is deliberately solid, not glass; the
     product's cyan bracket is the left edge. */
  #lowerThird { width:min(940px, 94vw); box-sizing:border-box;
    background:rgba(7,27,44,.94); border:1px solid rgba(103,230,245,.20);
    border-left:5px solid #67e6f5; border-radius:16px;
    padding:13px 24px 15px; margin-top:2px;
    box-shadow: 0 14px 34px rgba(0,0,0,.38);
    display:flex; flex-direction:column; align-items:center; gap:5px; }
  #status { font-size:13.5px; font-weight:600; letter-spacing:.05em;
    color:#8fb0c4; min-height:18px; text-align:center; }
  #caption { max-width:900px; text-align:center; font-size:22px; font-weight:600;
    line-height:1.45; color:#f4f8fb; min-height:56px; }
  #heard { max-width:900px; text-align:center; font-size:16px; color:#9db8c8;
    min-height:22px; font-style: italic; }
  /* Live heard line (2026-10-19): while a participant's utterance is
     still arriving (a draft), the line renders brighter with a live
     dot, so "words arriving right now" reads differently at a glance
     from a settled line; a settled line keeps the quiet style above.
     Kept visually apart from Lash's own #caption (bigger, brighter,
     non-italic, above this line). */
  #heard.draft { color:#b9d9e8; opacity:.82; }
  #heard.draft::after { content:' ●'; font-size:10px; color:#17b6c9;
    animation: heardPulse 1.1s ease-in-out infinite; }
  @keyframes heardPulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  /* Thinking indicator (2026-10-19, Howard): the silent gap while
     Lash composes read as "did he even hear me?" — so the moment a
     finished message lands, before any thinking starts, this pill
     goes up under the name strip: three pulsing dots + THINKING,
     sized to read at meeting-tile scale. It is driven ONLY by the
     bridge's 'think' signals (see createThinkIndicator + the 'think'
     subscription): on at final receipt, off at the answer's first
     playback or at a silent turn close. Space is reserved
     (min-height + visibility, never display:none) so the layout
     never jumps when it toggles. */
  #think { min-height:22px; font-size:15px; color:#17b6c9;
    visibility:hidden; opacity:0; transition: opacity .18s ease-in-out; }
  #think.on { visibility:visible; opacity:1; }
  #think .tdot { display:inline-block; margin:0 1.5px;
    animation: thinkPulse 1.2s ease-in-out infinite; }
  #think .tdot.d2 { animation-delay:.2s; }
  #think .tdot.d3 { animation-delay:.4s; }
  #think .tword { margin-left:9px; font-size:12px; font-weight:700;
    letter-spacing:.24em; }
  @keyframes thinkPulse { 0%,100% { opacity:.18; } 50% { opacity:1; } }
</style>

  <div id="name">Lash <span class="name-brand">· Moseley Innovations</span></div>

  <div id="lowerThird">
  <div id="status">connecting…</div>
  <div id="caption"></div>
  <div id="heard"></div>

<script>
const qs = new URLSearchParams(location.search);
const token = qs.get('t') || '';
const face = document.getElementById('face');
const statusEl = document.getElementById('status');
const captionEl = document.getElementById('caption');
const heardEl = document.getElementById('heard');
const thinkEl = document.getElementById('think');

const queue = [];
let playing = false;
let currentAudio = null;
let currentText = '';
let currentItem = null;   // queue item actually playing (accounting)

// Puppet state (stage v6) — declared early; the engine lives below the
// face-state code. PUP.on stays false until every mandatory layer has
// loaded, and every puppet failure path leaves the v5 medallion alone.
const PUP = {
  on: false, imgs: {}, speech: null, ctx: null,
  jaw: 0, perk: 0, perkVel: 0, tilt: 0, tiltVel: 0,
  blinkAt: 2600, blinkT0: -1, bounceT0: -1, lastTs: 0,
};

// 3D world state (stage v7) — a WebGL room + rigged dog rendered inside
// the medallion by the module script at the bottom of this page. WORLD.on
// flips true only after the scene AND model are fully ready; every
// failure before that leaves v6/v5 exactly as they were.
const WORLD = { on: false };

// Face ownership (stage v9, Howard 2026-10-15): the v5 animated loops —
// the Muse-styled animated GIFs of Lash — OWN the medallion by default;
// they are the avatar Howard likes best. The v6–v8 2D puppet is retired
// by his decision and the v7 3D world is not selected. Both engines stay
// in this file, intact and re-enableable (?fx=puppet / ?fx=world), but
// in the default path neither may take the face over: the puppet loader
// doesn't even fetch its layers, and the world module never builds.
const FX = (qs.get('fx') || 'loops').toLowerCase();
const LOOPS_MODE = FX !== 'puppet' && FX !== 'world';
window.__LASH_LOOPS_MODE__ = LOOPS_MODE;

function setStatus(s) { statusEl.textContent = s; }

// Face media fallback: if the video can't load (e.g. local relay serving),
// fall back to the emoji so the stage never shows a broken medallion.
try {
  const fv = document.getElementById('faceVideo');
  fv.addEventListener('error', () => { if (!PUP.on && !WORLD.on) face.textContent = '🐶'; }, true);
  const p = fv.play && fv.play();
  if (p && p.catch) p.catch(() => {});
} catch (e) { /* the poster/emoji world still works */ }

// ---- transport selection ----
// GitHub-mailbox mode (?gh=<owner/repo>&pat=<token>&session=<id>): production.
// Two append-only streams in one private repo, one writer each:
//   sessions/<id>/u/*  Howard's lines   (this page writes, the bridge reads)
//   sessions/<id>/s/*  Lash's lines     (the bridge writes, this page reads)
//   sessions/<id>/a/*  rendered speech audio for the s/ entries
//   sessions/<id>/c/*  control notes (barge-in, session end)
// Relay-WS mode is the local-test transport.
const GH = qs.get('gh');
const PAT = qs.get('pat');
const SESSION = qs.get('session') || 'dev-session';
const BRANCH = qs.get('branch') || 'main';
const ghMode = !!(GH && PAT);
const GH_API = `https://api.github.com/repos/${GH}`;
const SESS = `sessions/${SESSION}`;

// ---- live-wire mode (?live=<ably key>): Phase 2 production transport ----
// Ably channels lash-<session>-up (this page publishes utterances/control)
// and lash-<session>-down (speech lines + binary audio frames). GitHub
// stays as the archive, written by the bridge — not the road.
const LIVE_KEY = qs.get('live');
const liveMode = !!LIVE_KEY;
let upCh = null, downCh = null;
const pendingLines = new Map();
const pendingAudio = new Map();

// ---- latency trace (2026-10-15 latency rescue; log-only) ----
// In-page event stamps: window.__lashTrace collects
// {ev, seq, t (performance.now ms), wall (Date.now epoch ms)} so the
// harness and trace_report.py can size the stage spans (publish ->
// queued -> play_start -> play_end). play_start/play_end are also
// published up the wire as control notes — the bridge logs their
// receipt, which gives live sessions the playback spans tonight's
// logs could not account for at all.
window.__lashTrace = [];
function lashTrace(ev, seq, extra) {
  try {
    window.__lashTrace.push(Object.assign(
      {ev, seq: (seq == null ? null : seq),
       t: Math.round(performance.now() * 10) / 10, wall: Date.now()},
      extra || {}));
    if (window.__lashTrace.length > 600) window.__lashTrace.shift();
  } catch (e) { /* tracing must never break the stage */ }
  if ((ev === 'play_start' || ev === 'play_end') && upCh) {
    // Playback accounting rides these notes (stage v9.3): play_end
    // carries pos_ms/dur_ms (where playback stopped, from the audio
    // element's own clock) and stopped=true when the line was CUT
    // (barge-in/flush) rather than played out — the bridge splits
    // the line into heard/unheard at exactly that position.
    try { upCh.publish('control', Object.assign(
      {type: ev, seq: seq, wall: Date.now()}, extra || {}));
    } catch (e) {}
  }
}
// Emit a line's play_end exactly once, whichever way it ends.
function emitPlayEnd(item, stopped) {
  if (!item || item._playEndSent) return;
  item._playEndSent = true;
  let pos = null, dur = null;
  if (currentAudio) {
    try {
      if (isFinite(currentAudio.currentTime))
        pos = Math.round(currentAudio.currentTime * 1000);
      if (isFinite(currentAudio.duration))
        dur = Math.round(currentAudio.duration * 1000);
    } catch (e) { /* no clock (text lane): position stays unknown */ }
  }
  lashTrace('play_end', item.seq,
            {pos_ms: pos, dur_ms: dur, stopped: !!stopped});
}
// Filler queue guard: a queued, not-yet-playing filler must never sit
// ahead of a substantive line (the consult's queueing finding — an
// acknowledgment occupying the playback queue delays the real answer
// behind it). When substance arrives, queued fillers are preempted.
// Disable with ?fqguard=0.
const FQ_GUARD = qs.get('fqguard') !== '0';
function preemptQueuedFillers() {
  if (!FQ_GUARD) return;
  for (let i = queue.length - 1; i >= 0; i--) {
    if (queue[i].filler) {
      lashTrace('filler_preempted', queue[i].seq);
      queue.splice(i, 1);
    }
  }
}
function pairSpeech(seq) {
  const line = pendingLines.get(seq);
  if (!line) return;
  const url = pendingAudio.get(seq);
  // Oversized lines travel by reference instead of an inline frame
  // (Ably's 65,536-byte cap): the line carries gh_audio_path and
  // playNext fetches the MP3 through the existing gh playback path.
  if (!url && !line.gh_audio_path) return;
  pendingLines.delete(seq);
  pendingAudio.delete(seq);
  if (!line.filler) preemptQueuedFillers();
  queue.push({seq, text: line.text, audio_url: url || null,
              gh_audio_path: line.gh_audio_path || null,
              env: line.env || null, filler: !!line.filler});
  lashTrace('queued', seq);
  playNext();
}
if (liveMode && window.Ably) {
  try {
    const ably = new Ably.Realtime({key: LIVE_KEY, clientId: 'stage'});
    upCh = ably.channels.get(`lash-${SESSION}-up`);
    downCh = ably.channels.get(`lash-${SESSION}-down`);
    ably.connection.on('connected', () => {
      setStatus('listening (live)');
      face.className = 'listening';
      publishHello();
      // Greeting (stage v9): the playful standing portrait owns the
      // medallion only inside this bounded window after connect, and
      // only until the first real event — an utterance, a thinking
      // signal, or speech — supersedes it via faceRefresh(). The timer
      // is a bound, never the driver.
      greetingUntil = Date.now() + GREET_MS;
      faceRefresh();
      setTimeout(faceRefresh, GREET_MS + 60);
    });
    ably.connection.on('failed', () => setStatus('live wire failed'));
    downCh.subscribe('line', (m) => {
      lashTrace('line_recv', m.data.seq);
      pendingLines.set(m.data.seq, m.data);
      setTimeout(() => pendingLines.delete(m.data.seq), 8000);
      pairSpeech(m.data.seq);
    });
    downCh.subscribe('audio', (m) => {
      try {
        const buf = m.data;
        const seq = new DataView(buf).getUint32(0);
        lashTrace('audio_recv', seq);
        const blob = new Blob([buf.slice(4)], {type: 'audio/mpeg'});
        pendingAudio.set(seq, URL.createObjectURL(blob));
        setTimeout(() => pendingAudio.delete(seq), 8000);
        pairSpeech(seq);
      } catch (e) { /* bad frame — skip */ }
    });
    downCh.subscribe('flush', () => { lashTrace('flush_recv'); stopPlayback(); });
    downCh.subscribe('say_text', (m) => {
      if (!m.data.filler) preemptQueuedFillers();
      queue.push({seq: m.data.seq, kind: 'text', text: m.data.text,
                  voiceName: m.data.voiceName || null,
                  rate: m.data.rate || 1.0, pitch: m.data.pitch ?? 1.0,
                  filler: !!m.data.filler});
      lashTrace('queued', m.data.seq);
      playNext();
    });
/*THINK-INDICATOR-BEGIN*/
// Thinking indicator state machine (2026-10-19, Howard): a pure
// show/hide machine for the #think pill, driven exclusively by the
// bridge's 'think' signals — the reflex lives in the pipes, never
// in the brain. Semantics:
//   show(turn)  a finished message (a transcript FINAL) has been
//               received and an answer is being prepared. Repeated
//               shows for the SAME turn are not a change (gate
//               merges re-fire the signal); a show for a NEW turn
//               while visible IS a change (the indicator now speaks
//               for the newer thought) and stays up.
//   hide()      the answer's first line started playing (the
//               speaking state takes over), or the turn closed
//               with nothing spoken, or the thought was flushed /
//               the call ended / a failsafe fired. The indicator
//               must never claim an answer is coming when none is.
//   Nothing shows the indicator except a show(): no final, no pill.
function createThinkIndicator() {
  let visible = false, turn = null, shows = 0;
  function view() {
    return visible ? {visible: true, turn: turn}
                   : {visible: false, turn: null};
  }
  return {
    show(t) {
      if (visible && turn === t)
        return {changed: false, view: view(), closed: null};
      visible = true; turn = (t == null ? null : t); shows++;
      return {changed: true, view: view(), closed: null};
    },
    hide() {
      if (!visible)
        return {changed: false, view: view(), closed: null};
      const closed = turn;
      visible = false; turn = null;
      return {changed: true, view: view(), closed: closed};
    },
    view: view,
    shows: function () { return shows; },
  };
}
/*THINK-INDICATOR-END*/
    // Face-state signals from the bridge (stage v9): 'thinking' is
    // published the moment an utterance reaches the bridge and the
    // brain starts composing; 'done' when the turn's lines have all
    // shipped. The signals only move the state machine's flags — the
    // visible loop is always resolved by faceRefresh(), so a thinking
    // signal that lands mid-playback is remembered, not dropped, and
    // takes the face the instant playback ends.
    let thinkFailsafe = null;
    downCh.subscribe('face', (m) => {
      if (!m.data) return;
      if (m.data.state === 'thinking') {
        faceThinking = true;
        greetingUntil = 0;
        clearTimeout(thinkFailsafe);
        // Failsafe only: if the brain dies mid-compose (it has), the
        // work loop must not stare forever.
        thinkFailsafe = setTimeout(() => {
          faceThinking = false; faceRefresh();
        }, 25000);
        faceRefresh();
      } else if (m.data.state === 'done' || m.data.state === 'listening') {
        faceThinking = false;
        clearTimeout(thinkFailsafe);
        faceRefresh();
      } else if (m.data.state === 'muted') {
        // The bridge holds Lash muted (listen-only): present the
        // muted state until 'unmuted' (or the call ends).
        faceMuted = true;
        faceRefresh();
      } else if (m.data.state === 'unmuted') {
        faceMuted = false;
        faceRefresh();
      }
    });
    // Thinking indicator signals from the bridge (2026-10-19,
    // Howard): 'on' fires the instant a transcript FINAL lands at
    // the bridge — before the gate settle, before the brain is even
    // dispatched — so the room can see "he got it, an answer is
    // coming" for the whole compose gap. 'off' fires when the
    // answer's first line actually starts playing (reason
    // 'playback'), or when the turn closed with nothing spoken
    // ('silent'), was flushed by a barge-in ('flush'), or the call
    // ended ('leave') — the pill must never promise an answer that
    // is not coming. The bridge is the single authority for both
    // transitions; this handler only renders + acks.
    const thinkInd = createThinkIndicator();
    let thinkAckCount = 0;
    function thinkApply(res, reason) {
      if (!res || !res.changed) return;
      const v = res.view;
      try { thinkEl.classList.toggle('on', v.visible); } catch (e) {}
      if (v.visible) {
        // The face takes its thinking state on the same signal:
        // the bridge's own 'face' thinking publish only fires when
        // a fresh bridge turn opens, so a final that lands
        // mid-pileup would otherwise leave the face behind the
        // pill. (faceResolve still lets real playback outrank it.)
        faceThinking = true;
        clearTimeout(thinkFailsafe);
        // Failsafe only — if every clear path dies with a stuck
        // compose, the pill and the work loop must not stare
        // forever. Normal clears always arrive via 'off'.
        thinkFailsafe = setTimeout(() => {
          faceThinking = false; faceRefresh();
          thinkApply(thinkInd.hide(), 'failsafe');
        }, 30000);
        faceRefresh();
      } else if (reason === 'silent' || reason === 'flush'
                 || reason === 'leave' || reason === 'failsafe') {
        // That thought is dead: no answer is coming, so the face
        // leaves its thinking state too (a shipped turn's own
        // 'face' done may also land — both paths agree).
        faceThinking = false;
        clearTimeout(thinkFailsafe);
        faceRefresh();
      }
      // Measurement ack (the heard_render pattern): the bridge
      // pairs this stage-wall stamp with the final-receipt stamp,
      // so a run bundle can state final -> indicator-visible.
      if (thinkAckCount < 400 && upCh) {
        thinkAckCount++;
        try {
          upCh.publish('control', {type: 'think_render',
            state: v.visible ? 'on' : 'off',
            turn: v.visible ? v.turn : res.closed,
            reason: reason || null, wall: Date.now()});
        } catch (e) { /* telemetry is best-effort */ }
      }
    }
    downCh.subscribe('think', (m) => {
      if (!m.data) return;
      if (m.data.state === 'on') {
        thinkApply(thinkInd.show(m.data.turn), 'on');
      } else if (m.data.state === 'off') {
        thinkApply(thinkInd.hide(), m.data.reason || 'off');
      }
    });
  } catch (e) { setStatus('live wire error'); }
}

// ---- capability handshake ----
// Announce this browser's speech-synthesis inventory up the wire so the
// bridge can negotiate a voice profile and use the text lane (speak here)
// instead of shipping rendered audio. Republish as voices load.
let helloCount = 0;
let lastVoiceSig = '';
// World telemetry (v7.1): what the 3D layer is doing in THIS browser —
// the local test harness could not see CDN/WebGL reality, so the stage
// now reports it up the wire in every hello.
function presentedFace() {

function synthEnvelope(text, seconds) {

  for (const w of words) {
    const groups = (w.toLowerCase().match(/[aeiouy]+/g) || []).length;
    syl.push(Math.max(1, Math.min(4, groups || 1)));

  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

    const dt = seconds * (s / total);
    const peak = 0.45 + rnd() * 0.5;
    for (let k = 0; k < 3; k++) {
      const idx = Math.floor((t + k * win) / win);
      if (idx < n) env[idx] = Math.max(env[idx], peak * (1 - k * 0.3));
    }

  }

function pupProfile(y) {
  const W = PUP_WARP;

  // must arrive AT the mouth band, not only deep in the beard — with
  // the old linear ramp the mouth line itself moved ~2px at full jaw
  // and the motion was invisible at Meet tile sizes (harness-measured).
  if (y <= W.peakY) { const t = Math.min(1, (y - W.y) / (W.peakY - W.y) * (W.ramp || 1.5)); return t * t * (3 - 2 * t); }

function ghHeaders(extra) {
  return Object.assign({Authorization: `Bearer ${PAT}`,
                        Accept: 'application/vnd.github+json'}, extra || {});
}
function b64utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64bytes(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function ghPut(path, base64Content, message) {
  try {
    await fetch(`${GH_API}/contents/${path}`, {
      method: 'PUT', headers: ghHeaders({'Content-Type': 'application/json'}),
      body: JSON.stringify({message, content: base64Content, branch: BRANCH}),
    });
  } catch (e) { /* transient; the conversation carries on */ }
}
function ghPutJSON(path, obj) {
  return ghPut(path, b64utf8(JSON.stringify(obj)), `mailbox ${path}`);
}
async function ghRaw(path) {
  const r = await fetch(`${GH_API}/contents/${path}?ref=${BRANCH}`, {
    headers: ghHeaders({Accept: 'application/vnd.github.raw+json'})});
  if (!r.ok) throw new Error('gh raw ' + r.status);
  return r;
}
async function ghRawObjectURL(path) {
  const r = await ghRaw(path);
  const blob = await r.blob();
  return URL.createObjectURL(blob);
}

  setStatus('listening');
  face.className = 'listening';

  setInterval(async () => {
    try {
      const headers = ghHeaders();
      if (etag) headers['If-None-Match'] = etag;
      const r = await fetch(`${GH_API}/git/trees/${BRANCH}?recursive=1`, {headers});
      if (r.status === 304) return;
      if (!r.ok) return;
      etag = r.headers.get('ETag');
      const data = await r.json();
      const prefix = `${SESS}/s/`;
      const entries = (data.tree || [])
        .filter(e => e.type === 'blob' && e.path.startsWith(prefix) && e.path.endsWith('.json'))
        .sort((a, b) => a.path < b.path ? -1 : 1);

        if (seenSpeeches.has(e.path)) continue;
        seenSpeeches.add(e.path);
        try {
          const resp = await ghRaw(e.path);
          const row = await resp.json();
          queue.push({seq: row.seq, kind: row.kind, text: row.text,
                      gh_audio_path: row.audio || null});
        } catch (err) { /* skip a bad entry */ }
      }
      if (entries.length) playNext();
    } catch (e) { /* poll again next tick */ }
  }, 1000);

    const rawH = maxY - minY;
    const s = rawH > 0 ? 1.0 / rawH : 1;
    model.scale.setScalar(s);
    model.position.set(-((minX + maxX) / 2) * s, -minY * s, -((minZ + maxZ) / 2) * s);
    scene.updateMatrixWorld(true);
    model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });

    // GLTFLoader strips dots from node names ('Ear1.L' loads as 'Ear1L').
    const bone = (name) => model.getObjectByName(name) ||
                            model.getObjectByName(name.replace(/\./g, '')) || null;
    for (const n of ['Head', 'Neck3', 'Neck1', 'Ear1.L', 'Ear1.R', 'Tail1', 'Tail2', 'Torso'])
      B[n] = bone(n);
    WDIAG.bones = Object.keys(B).filter((k) => B[k]);
    if (!B.Head) { worldFail('rig', 'no Head bone in model'); return; }

    mixer = new THREE.AnimationMixer(model);
    const findClip = (name) => THREE.AnimationClip.findByName(gltf.animations, name);
    const mk = (name, loop) => {
      const c = findClip(name);
      if (!c) return null;
      const a = mixer.clipAction(c);
      a.loop = loop ? THREE.LoopRepeat : THREE.LoopOnce;
      a.clampWhenFinished = !loop;
      return a;
    };
    ACT.idle = mk('Idle', true);
    ACT.idle2 = mk('Idle_2', true);
    ACT.headlow = mk('Idle_2_HeadLow', true);
    ACT.jump = mk('Jump_ToIdle', false);
    WDIAG.clips = gltf.animations.map((a) => a.name);
    if (!ACT.idle) { worldFail('rig', 'no Idle clip in model'); return; }
    ACT.idle.play();
    curAction = ACT.idle;
    function crossTo(a, dur) {
      if (!a || a === curAction) return;
      const prev = curAction;
      a.enabled = true;
      a.reset();
      a.setEffectiveWeight(1);
      a.fadeIn(dur || 0.45);
      a.play();
      if (prev) prev.fadeOut(dur || 0.45);
      curAction = a;
    }

    // Camera: frame the dog from the head side, gentle three-quarter.
    const hv = new THREE.Vector3(), tv = new THREE.Vector3();
    B.Head.getWorldPosition(hv);
    if (B.Tail1) B.Tail1.getWorldPosition(tv); else tv.set(hv.x, hv.y, hv.z - 0.5);
    const fwd = hv.clone().sub(tv); fwd.y = 0;
    if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, 1);
    fwd.normalize();
    const side = new THREE.Vector3(-fwd.z, 0, fwd.x);
    camera.position.copy(hv)
      .addScaledVector(fwd, 1.5).addScaledVector(side, 0.52);
    camera.position.y = hv.y + 0.14;
    camera.lookAt(hv.x - fwd.x * 0.34, hv.y - 0.30, hv.z - fwd.z * 0.34);
    // Warm back wall behind the dog, facing the camera.
    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 9),
      new THREE.MeshStandardMaterial({ color: 0x4a3423, roughness: 1 }));
    wall.position.copy(fwd.clone().multiplyScalar(-3.6));
    wall.position.y = 2.2;
    wall.lookAt(0, 1.4, 0);
    scene.add(wall);

    window.worldSetState = (name) => {
      try {
        cur = name;
        W.idle2Until = 0;
        if (name === 'make') {
          if (ACT.jump) {
            crossTo(ACT.jump, 0.12);
            W.jumpUntil = performance.now() + ACT.jump.getClip().duration * 1000;
          }
          W.perkVel += 2.6;
        } else if (name === 'work') {
          crossTo(ACT.headlow || ACT.idle2 || ACT.idle, 0.5);
        } else {
          crossTo(ACT.idle, 0.4);
        }
      } catch (e) { /* state flips must never throw into the stage */ }
    };
    window.__lashWorld = {
      on: () => WORLD.on, jaw: () => W.jaw, state: () => cur, diag: WDIAG,
      tune: WTUNE,
      headRot: () => B.Head ? [B.Head.rotation.x, B.Head.rotation.y, B.Head.rotation.z] : null,
      cam: () => camera.position.toArray(),
    };

    const clock = new THREE.Clock();
    const spring = (x, v, target, stiff, damp, dt) => {
      v += ((target - x) * stiff - v * damp) * dt;
      x += v * dt;
      return [x, v];
    };
    function tick() {
      if (!WORLD.on) return;
      if (document.hidden) return;
      try {
        WDIAG.frames += 1;
        const dt = Math.min(0.05, clock.getDelta());
        const ts = performance.now(), t = ts / 1000;
        // Speech envelope -> jaw: identical math to the v6 puppet jaw.
        let amp = 0;
        if (PUP.speech) {
          const sp = PUP.speech;
          const ct = (sp.mode === 'audio' && currentAudio)
            ? currentAudio.currentTime : (ts - sp.t0) / 1000;
          const idx = Math.floor(ct / 0.06);
          if (idx >= 0 && idx < sp.env.length) amp = sp.env[idx];
        }
        W.jaw += (amp - W.jaw) * (amp > W.jaw ? 0.55 : 0.30);
        if (W.jaw < 0.003 && !PUP.speech) W.jaw = 0;
        if (PUP.speech && !W.prevSpeech) W.perkVel += 2.2;   // line start: ears up
        W.prevSpeech = PUP.speech;
        const perkT = PUP.speech ? 0.8 : (cur === 'make' ? 1.0 : (cur === 'work' ? 0.35 : 0.12));
        [W.perk, W.perkVel] = spring(W.perk, W.perkVel, perkT, 110, 13, dt);
        [W.tilt, W.tiltVel] = spring(W.tilt, W.tiltVel, cur === 'work' ? WTUNE.tiltRad : 0, 46, 10, dt);
        [W.look, W.lookVel] = spring(W.look, W.lookVel, cur === 'work' ? WTUNE.lookDown : 0, 46, 10, dt);
        if (ACT.jump && curAction === ACT.jump && ts > W.jumpUntil && W.jumpUntil)
          crossTo(ACT.idle, 0.35);
        // Idle variety: an occasional Idle_2 visit while just listening.
        if (cur === 'idle' && !PUP.speech && ACT.idle2) {
          if (!W.idle2Until && ts > W.nextIdle2) { crossTo(ACT.idle2, 0.6); W.idle2Until = ts + 3600; }
          else if (W.idle2Until && ts > W.idle2Until) {
            W.idle2Until = 0; W.nextIdle2 = ts + 9000 + Math.random() * 6000;
            crossTo(ACT.idle, 0.6);
          }
        }
        // Procedural layer: deltas added on top of the clip pose. Every
        // delta is UNDONE before the next mixer.update — a channel the
        // clip doesn't animate would otherwise accumulate our deltas
        // frame over frame (that bug stretched the neck in testing).
        for (const [obj, key2, val] of W.applied) obj[key2] -= val;
        W.applied.length = 0;
        mixer.update(dt);
        const add = (obj, key2, val) => { obj[key2] += val; W.applied.push([obj, key2, val]); };
        const jaw = W.jaw;
        if (B.Head) {
          add(B.Head.rotation, 'x', WTUNE.pitchSign * (jaw * WTUNE.jawDip + W.look));
          add(B.Head.rotation, 'z', WTUNE.tiltSign * W.tilt);
          add(B.Head.position, 'y', -jaw * WTUNE.jawDrop);
        }
        if (B.Neck3) add(B.Neck3.rotation, 'x', WTUNE.pitchSign * jaw * WTUNE.neckDip);
        if (B.Neck1) add(B.Neck1.rotation, 'x', WTUNE.pitchSign * W.look * 0.4);
        if (B.Torso) add(B.Torso.rotation, 'x', Math.sin(t * (2 * Math.PI / 3.6)) * 0.012);
        // Ears: perk splay + the blink-equivalent (a quick single-ear flick).
        let flick = 0;
        if (W.flickT0 < 0 && ts > W.flickAt) { W.flickT0 = ts; W.flickEar = Math.random() < 0.5 ? 'L' : 'R'; }
        if (W.flickT0 >= 0) {
          const p = (ts - W.flickT0) / 240;
          if (p >= 1) { W.flickT0 = -1; W.flickAt = ts + 2400 + Math.random() * 3200; }
          else flick = Math.sin(p * Math.PI);
        }
        const earSwing = Math.sin(t * 0.9) * 0.03 * (1 - W.perk * 0.5);
        if (B['Ear1.L']) {
          add(B['Ear1.L'].rotation, 'z', WTUNE.earSplay * W.perk + earSwing +
            (W.flickEar === 'L' ? flick * 0.35 : 0));
          add(B['Ear1.L'].rotation, 'x', -WTUNE.earBack * W.perk);
        }
        if (B['Ear1.R']) {
          add(B['Ear1.R'].rotation, 'z', -WTUNE.earSplay * W.perk - earSwing -
            (W.flickEar === 'R' ? flick * 0.35 : 0));
          add(B['Ear1.R'].rotation, 'x', -WTUNE.earBack * W.perk);
        }
        // Tail wag: faster and wider when greeting or talking.
        const wagSpeed = cur === 'make' ? 10 : (PUP.speech ? 6.5 : 2.4);
        const wagAmp = cur === 'make' ? 0.5 : (PUP.speech ? 0.36 : 0.16);
        W.wagPhase += dt * wagSpeed;
        if (B.Tail1) add(B.Tail1.rotation, 'y', Math.sin(W.wagPhase) * wagAmp);
        if (B.Tail2) add(B.Tail2.rotation, 'y', Math.sin(W.wagPhase - 0.7) * wagAmp * 0.7);
        renderer.render(scene, camera);
        W.errStreak = 0;
      } catch (e) {
        W.errStreak += 1;
        WDIAG.err = String((e && e.message) || e);
        if (W.errStreak > 5) worldDisable();
      }
    }
    worldEnable();
    renderer.setAnimationLoop(tick);
  } catch (e) { worldFail('build', e); }
})();
</script>
</body>
</html>
